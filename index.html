  <style>
    /* ==========================================================================
       TWILIGHT LOTUS DUAL THEME TOKENS (DARK & LIGHT)

    :root {
      /* Mode Gelap (Twilight Lotus Dark) */
      --bg-base: #0C0918;
      --text-primary: #F7F5FC;
      --text-secondary: #A9A0C4;
      --text-muted: #746A94;

      --accent-primary: #8B96F2;
      --accent-secondary: #B78EF5;
      --accent-purple-dot: #A855F7;
      --accent-gold: #F6C856;
      --accent-gold-ring: rgba(246, 200, 86, 0.34);
      --accent-delivered: #6EE7B7;
      --accent-retur: #FDA4AF;

      --cta-gradient: linear-gradient(135deg, #7884E8, #B78EF5);
      --cta-text: #0C0918;
      --cta-shadow: 0 8px 24px -6px rgba(155, 132, 242, 0.45);
      --cta-shadow-hover: 0 10px 28px -4px rgba(183, 142, 245, 0.6);

      --route-gradient: linear-gradient(90deg, #7884E8 0%, #B78EF5 55%, #F6C856 100%);
      --route-track: rgba(227, 186, 245, 0.14);

      --hairline: rgba(227, 186, 245, 0.11);
      --zebra-alt: rgba(183, 142, 245, 0.045);
      --zebra-hover: rgba(183, 142, 245, 0.085);

      --pill-bg: rgba(255, 255, 255, 0.045);
      --pill-bg-hover: rgba(255, 255, 255, 0.085);
      --pill-border: rgba(227, 186, 245, 0.14);
      --badge-bg: rgba(120, 132, 232, 0.16);

      --search-line: rgba(227, 186, 245, 0.18);
      --search-focus: #B78EF5;

      --timeline-line: linear-gradient(180deg, rgba(246, 200, 86, 0.5) 0%, rgba(183, 142, 245, 0.32) 48%, rgba(120, 132, 232, 0.10) 100%);
      --timeline-dot-past: #8B96F2;

      --overlay-bg: rgba(6, 4, 13, 0.74);
      --sheet-bg: linear-gradient(180deg, rgba(23, 18, 48, 0.96) 0%, rgba(12, 9, 24, 0.99) 100%);
      --sheet-shadow: 0 -20px 60px rgba(6, 4, 13, 0.85);
      --toast-bg: rgba(24, 18, 52, 0.95);
      --toast-shadow: 0 12px 32px rgba(6, 4, 13, 0.72);
    }

    html.light {
      /* Mode Terang (Morning Lotus Light) */
      --bg-base: #FAF8FD;
      --text-primary: #141026;
      --text-secondary: #595175;
      --text-muted: #8B81A8;

      --accent-primary: #5663D1;
      --accent-secondary: #8C63DF;
      --accent-purple-dot: #7E22CE;
      --accent-gold: #D98A1C;
      --accent-gold-ring: rgba(217, 138, 28, 0.28);
      --accent-delivered: #0D9488;
      --accent-retur: #E11D48;

      --cta-gradient: linear-gradient(135deg, #5663D1, #8C63DF);
      --cta-text: #FFFFFF;
      --cta-shadow: 0 8px 22px -6px rgba(86, 99, 209, 0.36);
      --cta-shadow-hover: 0 10px 26px -4px rgba(140, 99, 223, 0.48);

      --route-gradient: linear-gradient(90deg, #5663D1 0%, #936CE8 55%, #D98A1C 100%);
      --route-track: rgba(20, 16, 38, 0.09);

      --hairline: rgba(20, 16, 38, 0.08);
      --zebra-alt: rgba(86, 99, 209, 0.04);
      --zebra-hover: rgba(86, 99, 209, 0.075);

      --pill-bg: rgba(20, 16, 38, 0.035);
      --pill-bg-hover: rgba(20, 16, 38, 0.07);
      --pill-border: rgba(20, 16, 38, 0.09);
      --badge-bg: rgba(86, 99, 209, 0.11);

      --search-line: rgba(20, 16, 38, 0.14);
      --search-focus: #5663D1;

      --timeline-line: linear-gradient(180deg, rgba(217, 138, 28, 0.45) 0%, rgba(140, 99, 223, 0.28) 50%, rgba(86, 99, 209, 0.10) 100%);
      --timeline-dot-past: #8C63DF;

      --overlay-bg: rgba(20, 16, 38, 0.32);
      --sheet-bg: linear-gradient(180deg, rgba(252, 250, 255, 0.96) 0%, rgba(243, 238, 249, 0.99) 100%);
      --sheet-shadow: 0 -18px 50px rgba(20, 16, 38, 0.14);
      --toast-bg: rgba(255, 255, 255, 0.96);
      --toast-shadow: 0 12px 30px rgba(20, 16, 38, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .atmosphere-dark {
      background-color: #0C0918;
      background-image:
        radial-gradient(ellipse 64% 42% at 20% 10%, rgba(111, 124, 230, 0.22) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 56% 36% at 55% -4%, rgba(155, 132, 242, 0.16) 0%, rgba(155, 132, 242, 0) 74%),
        radial-gradient(ellipse 48% 32% at 82% 8%, rgba(223, 183, 242, 0.11) 0%, rgba(223, 183, 242, 0) 72%),
        linear-gradient(180deg, #15102B 0%, #0F0B21 40%, #0C0918 100%);
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-dark {
      opacity: 0;
    }

    .atmosphere-light {
      background-color: #FAF8FD;
      background-image:
        radial-gradient(ellipse 64% 44% at 20% 8%, rgba(111, 124, 230, 0.11) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 54% 38% at 78% 6%, rgba(196, 152, 235, 0.15) 0%, rgba(196, 152, 235, 0) 74%),
        linear-gradient(180deg, #F3EEF9 0%, #F7F4FC 42%, #FAF8FD 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-light {
      opacity: 1;
    }

    .editorial-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .text-lotus-primary { color: var(--text-primary); }
    .text-lotus-secondary { color: var(--text-secondary); }
    .text-lotus-muted { color: var(--text-muted); }
    .text-lotus-accent { color: var(--accent-primary); }
    .text-lotus-gold { color: var(--accent-gold); }
    .text-lotus-delivered { color: var(--accent-delivered); }
    .text-lotus-retur { color: var(--accent-retur); }

    .lotus-pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      transition: background-color 0.25s ease, border-color 0.35s ease, color 0.35s ease;
    }

    .lotus-pill:hover {
      background-color: var(--pill-bg-hover);
    }

    .lotus-divider {
      border: 0;
      border-top: 1px solid var(--hairline);
    }

    .lotus-cta-btn {
      background: var(--cta-gradient);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .lotus-cta-btn:hover {
      filter: brightness(1.05);
      box-shadow: var(--cta-shadow-hover);
    }

    .lotus-cta-btn:active {
      transform: scale(0.97);
    }

    /* Borderless Search Underline */
    .search-underline {
      border-bottom: 1px solid var(--search-line);
      transition: border-color 0.3s ease;
    }

    .search-underline:focus-within {
      border-bottom-color: var(--search-focus);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.85;
    }

    select option {
      background-color: #171230;
      color: #F7F5FC;
    }
    html.light select option {
      background-color: #FAF8FD;
      color: #141026;
    }

    /* Cardless Alternating Zebra Rows */
    .zebra-row {
      transition: background-color 0.2s ease;
    }
    .zebra-row:nth-child(even) {
      background-color: var(--zebra-alt);
    }
    .zebra-row:hover {
      background-color: var(--zebra-hover);
    }

    /* Radar Dot Pulse */
    @keyframes goldRadarPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 0 6px rgba(246, 200, 86, 0);
      }
    }

    .radar-pulse-dot {
      background-color: var(--accent-gold);
      animation: goldRadarPulse 2.6s ease-in-out infinite;
    }

    /* Route Progress Track */
    .route-track-bg {
      background-color: var(--route-track);
    }

    .route-progress-beam {
      background: var(--route-gradient);
    }

    .route-comet-dot {
      background-color: var(--accent-gold);
      box-shadow: 0 0 10px 2px var(--accent-gold-ring), 0 0 4px 1px var(--accent-gold);
    }

    /* Vertical Timeline */
    .timeline-vertical-line {
      background: var(--timeline-line);
    }

    @keyframes checkpointHalo {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 4px var(--accent-gold-ring), 0 0 12px var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.14);
        box-shadow: 0 0 0 8px rgba(246, 200, 86, 0), 0 0 16px var(--accent-gold-ring);
      }
    }

    .timeline-active-node {
      background-color: var(--accent-gold);
      animation: checkpointHalo 2.5s ease-in-out infinite;
    }

    .timeline-past-node {
      background-color: var(--timeline-dot-past);
    }

    /* Slide-Up Frosted Bottom Sheet */
    .drawer-overlay {
      background-color: var(--overlay-bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .drawer-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-sheet {
      background: var(--sheet-bg);
      border-top: 1px solid var(--pill-border);
      box-shadow: var(--sheet-shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drawer-overlay.is-open .drawer-sheet {
      transform: translateY(0);
    }

    /* Floating Toast */
    .lotus-toast {
      background-color: var(--toast-bg);
      border: 1px solid var(--pill-border);
      box-shadow: var(--toast-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="relative min-h-[100dvh] selection:bg-[#8B96F2]/25">

  <!-- Full-Viewport Dual Atmospheric Background Layers -->
  <div class="atmosphere-dark fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>
  <div class="atmosphere-light fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>

  <!-- Adaptive Container: Single-Column on Mobile, Proportional 2-Column on Desktop -->
  <div class="relative z-10 w-full max-w-[1040px] mx-auto px-5 sm:px-8 pt-8 pb-24">

    <!-- 1. Top Header -->
    <header class="flex items-center justify-between gap-3 pb-7 mb-9 border-b border-[var(--hairline)]">
      <!-- Clean Brand Wordmark ('larba.') with Purple Dot -->
      <button
        id="brandResetBtn"
        type="button"
        class="inline-flex items-baseline focus:outline-none cursor-pointer"
        aria-label="larba."
      >
        <span class="editorial-heading text-[26px] text-lotus-primary leading-none">larba</span>
        <span style="color: var(--accent-purple-dot);" class="editorial-heading text-[28px] leading-none">.</span>
      </button>

      <!-- Right Controls: Theme Switcher & Active User Pill -->
      <div class="flex items-center gap-2.5">
        <button
          id="themeToggleBtn"
          type="button"
          class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-primary cursor-pointer"
        >
          <svg id="iconSun" class="w-3.5 h-3.5 text-lotus-gold shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="iconMoon" class="hidden w-3.5 h-3.5 text-lotus-accent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <span id="themeToggleLabel">Mode Terang</span>
        </button>

        <div class="lotus-pill hidden sm:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-secondary">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6EE7B7]"></span>
          <span>Barranetmedia</span>
        </div>
      </div>
    </header>

    <!-- Main 2-Column Desktop Grid (5 Cols Left Controls / 7 Cols Right Cardless Results) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-start">

      <!-- LEFT COLUMN (5 Cols on Desktop): Editorial Title & Borderless Search -->
      <aside class="lg:col-span-5 lg:sticky lg:top-8">
        <!-- Professional Eyebrow Badge -->
        <div class="lotus-pill inline-flex items-center gap-2 px-3 py-1 rounded-full mb-4">
          <span class="w-1.5 h-1.5 rounded-full radar-pulse-dot shrink-0"></span>
          <span class="font-sans text-[11px] font-semibold tracking-[0.06em] uppercase text-lotus-primary">
            Rahasia Perusahaan
          </span>
        </div>

        <!-- Headline & Subtitle -->
        <h1 class="editorial-heading text-[28px] sm:text-[32px] text-lotus-primary mb-2">
          Lacak Resi Barranetmedia
        </h1>
        <p class="text-[14px] leading-relaxed text-lotus-secondary mb-7">
          Selamat berjuang sukses...
        </p>

        <!-- Borderless Multi-Query Search Input -->
        <div class="search-underline pb-3">
          <div class="flex items-start gap-2">
            <textarea

              rows="2"
              spellcheck="false"

          <div class="search-underline pb-2">

            />
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap items-center gap-2.5 mt-6">
          <button
            id="searchBtn"
            type="button"
            class="lotus-cta-btn font-bold text-[13px] px-5 py-2.5 rounded-full cursor-pointer"

            Cari Resi

          <button

            type="button"
            class="lotus-pill text-[12.5px] font-medium text-lotus-primary px-4 py-2.5 rounded-full cursor-pointer"

          <button
            id="clearBtn"
            type="button"
            class="text-[12.5px] font-medium text-lotus-secondary hover:text-lotus-primary px-2.5 py-2 transition-colors cursor-pointer"
          >
            Bersihkan
          </button>
        </div>
      </aside>

      <!-- RIGHT COLUMN (7 Cols on Desktop): Cardless Zebra-Striped Results Stream -->
      <main aria-label="Daftar Resi Pengiriman" class="lg:col-span-7 lg:border-l lg:border-[var(--hairline)] lg:pl-10">

            Daftar Resi
          </h2>
          <span id="statusLine" class="font-sans text-[12px] font-medium text-lotus-muted">
            Siap mencari
          </span>
        </div>

        <!-- Cardless Alternating Zebra List Container -->
        <div id="resultsArea" class="divide-y divide-[var(--hairline)]"></div>
      </main>

    </div>
  </div>

  <!-- SLIDE-UP FROSTED BOTTOM SHEET ('In-App Live SPX Tracking') -->

    var expandedRows = {};
    var currentFiltered = [];

    var el = {

    /* Dual Theme Switcher */
    function toggleTheme() {
      var root = document.documentElement;
      var switchingToLight = !root.classList.contains('light');
      if (switchingToLight) {
        root.classList.remove('dark');
        root.classList.add('light');
        el.iconSun.classList.add('hidden');
        el.iconMoon.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Gelap';
      } else {
        root.classList.remove('light');
        root.classList.add('dark');
        el.iconMoon.classList.add('hidden');
        el.iconSun.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Terang';
      }
      showToast(switchingToLight ? 'Beralih ke Mode Terang' : 'Beralih ke Mode Gelap');
    }

    el.themeToggleBtn.addEventListener('click', toggleTheme);

    function showToast(message) {
      el.toastText.textContent = message;
      el.toastBanner.classList.remove('opacity-0', 'translate-y-2');
      el.toastBanner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.toastBanner.classList.remove('opacity-100', 'translate-y-0');
        el.toastBanner.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function copyText(text) {
      var temp = document.createElement('textarea');
      temp.value = text;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        showToast('Nomor resi disalin');
      } catch (e) {
        showToast('Gagal menyalin resi');
      }
      document.body.removeChild(temp);
    }

    function getStatusMeta(status) {
      var s = (status || '').toLowerCase();
      if (s.indexOf('deliver') !== -1) {
        return { label: status, colorClass: 'text-lotus-delivered', dotColor: 'var(--accent-delivered)' };
      }
      if (s.indexOf('ongoing') !== -1 || s.indexOf('on going') !== -1) {
        return { label: status, colorClass: 'text-lotus-gold', dotColor: 'var(--accent-gold)' };
      }
      if (s.indexOf('retur') !== -1) {
        return { label: status, colorClass: 'text-lotus-retur', dotColor: 'var(--accent-retur)' };
      }
      return { label: status, colorClass: 'text-lotus-accent', dotColor: 'var(--accent-primary)' };
    }

    function renderInitialEmptyState() {
      currentFiltered = [];
      el.statusLine.textContent = 'Siap mencari';
      el.resultsArea.innerHTML =
        '<div class="py-16 px-4 text-center">' +
          '<p class="text-[14px] font-semibold text-lotus-primary">Belum ada data resi ditampilkan</p>' +
          '<p class="text-[12.5px] text-lotus-muted mt-1">Masukkan nomor resi, nama pelanggan, atau no HP lalu tekan Cari Resi.</p>' +
        '</div>';
    }

    function filterOrders() {
      var rawQ = el.queryInput.value.trim().toLowerCase();
      var terms = rawQ ? rawQ.split(/[\n,]+/).map(function (t) { return t.trim(); }).filter(Boolean) : [];
      var cs = el.csInput.value.trim().toLowerCase();
      var st = el.statusInput.value;
      var dFrom = el.dateFromInput.value;
      var dTo = el.dateToInput.value;

      if (terms.length === 0 && !cs && !st && !dFrom && !dTo) {
        renderInitialEmptyState();
        return;
      }

      currentFiltered = SAMPLE_ORDERS.filter(function (item) {
        if (terms.length > 0) {
          var matchTerm = terms.some(function (t) {
            return item.resi.toLowerCase().includes(t) ||
                   item.nama.toLowerCase().includes(t) ||
                   item.noHp.toLowerCase().includes(t);
          });
          if (!matchTerm) return false;
        }
        if (cs && !item.cs.toLowerCase().includes(cs)) return false;
        if (st) {
          var itemSt = item.status.toLowerCase().replace(/\s+/g, '');
          if (itemSt.indexOf(st) === -1) return false;
        }
        return true;
      });

      el.statusLine.textContent = currentFiltered.length + ' hasil ditemukan';
      renderRows(currentFiltered);
    }

    function toggleRowDetail(resi) {
      expandedRows[resi] = !expandedRows[resi];
      renderRows(currentFiltered);
    }

    function renderRows(list) {
      if (list.length === 0) {
        el.resultsArea.innerHTML =
          '<div class="py-14 px-4 text-center">' +
            '<p class="text-[14.5px] font-semibold text-lotus-primary">Tidak ada resi yang cocok</p>' +
            '<p class="text-[12.5px] text-lotus-secondary mt-1">Klik "Bersihkan" untuk mengatur ulang pencarian.</p>' +
          '</div>';
        return;
      }

      el.resultsArea.innerHTML = list.map(function (item) {
        var meta = getStatusMeta(item.status);
        var isOpen = !!expandedRows[item.resi];
        var hargaFmt = 'Rp' + Number(item.harga).toLocaleString('id-ID');

        return (
          '<article class="zebra-row px-3.5 sm:px-4 py-4 rounded-lg">' +
            // Row 1: Resi (Plus Jakarta Sans) + Status + Tanggal/CS
            '<div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">' +
              '<div class="inline-flex items-center gap-2 flex-wrap">' +
                '<span style="background-color:' + meta.dotColor + ';" class="w-1.5 h-1.5 rounded-full shrink-0"></span>' +
                '<button type="button" onclick="copyText(\'' + item.resi + '\')" class="font-sans text-[14.5px] font-bold tracking-[0.02em] text-lotus-primary hover:text-lotus-accent transition-colors cursor-pointer" title="Salin resi">' +
                  escapeHtml(item.resi) +
                '</button>' +
                '<span class="text-lotus-muted">&middot;</span>' +
                '<span class="font-sans text-[11.5px] font-semibold uppercase tracking-wide ' + meta.colorClass + '">' +
                  escapeHtml(meta.label) +
                '</span>' +
              '</div>' +

              '<div class="font-sans text-[12px] text-lotus-secondary">' +
                escapeHtml(item.tanggal) + ' <span class="text-lotus-muted">&middot;</span> CS ' + escapeHtml(item.cs) +
              '</div>' +
            '</div>' +

            // Row 2: Nama + No HP + Harga
            '<div class="flex flex-wrap items-baseline justify-between gap-2 mb-1">' +
              '<p class="text-[14px] font-semibold text-lotus-primary">' +
                escapeHtml(item.nama) +
                ' <span class="font-sans text-[12.5px] font-normal text-lotus-secondary">&middot; ' + escapeHtml(item.noHp) + '</span>' +
              '</p>' +
              '<span class="font-sans text-[13px] font-semibold text-lotus-gold">' + hargaFmt + '</span>' +
            '</div>' +

            // Row 3: Produk & Alamat
            '<p class="text-[13px] text-lotus-secondary leading-relaxed ' + (isOpen ? '' : 'truncate') + '">' +
              escapeHtml(item.produk) + ' <span class="text-lotus-muted">&mdash;</span> ' + escapeHtml(item.alamat) +
            '</p>' +

            // Row 4: Action Links
            '<div class="flex items-center justify-between gap-3 mt-3">' +
              '<div class="flex items-center gap-2 flex-wrap">' +
                '<button type="button" onclick="openLiveTrack(\'' + item.resi + '\')" class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-semibold text-lotus-accent hover:text-lotus-primary cursor-pointer">' +
                  '<span class="w-1.5 h-1.5 rounded-full radar-pulse-dot"></span>' +
                  '<span>Lacak Paket</span>' +
                '</button>' +
                '<button type="button" onclick="showToast(\'Membuka WhatsApp ke ' + escapeHtml(item.nama) + '\')" class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-delivered cursor-pointer">' +
                  '<span>WhatsApp</span>' +
                '</button>' +
                '<button type="button" onclick="copyText(\'' + item.resi + '\')" class="text-[12px] font-medium text-lotus-secondary hover:text-lotus-primary px-2 py-1 transition-colors cursor-pointer">' +
                  'Salin' +
                '</button>' +
              '</div>' +

              '<button type="button" onclick="toggleRowDetail(\'' + item.resi + '\')" class="inline-flex items-center gap-1 text-[11.5px] font-medium text-lotus-muted hover:text-lotus-primary transition-colors cursor-pointer">' +
                '<span>' + (isOpen ? 'Ringkas' : 'Detail') + '</span>' +
                '<svg class="w-3.5 h-3.5 transition-transform duration-150 ' + (isOpen ? 'rotate-180' : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
              '</button>' +
            '</div>' +
          '</article>'
        );
      }).join('');
    }

    /* Live SPX Tracking Bottom Sheet */
    function openLiveTrack(resi) {
      activeDrawerResi = resi;
      el.drawerResiCode.textContent = resi;
      el.drawerCopyLabel.textContent = 'Salin';
      el.trackDrawerOverlay.classList.add('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'false');

      var track = LIVE_TRACKING_DATA[resi] || Object.assign({}, LIVE_TRACKING_DATA["DEFAULT_ONGOING"], { resi: resi });
      var isDelivered = track.statusUtama === "Delivered";
      var latest = track.riwayat[0];

      var html =
        '<div class="mb-2 flex items-center justify-between gap-2">' +
          '<div class="flex items-center gap-2">' +
            '<span class="font-sans text-[11.5px] font-semibold uppercase tracking-wider ' + (isDelivered ? 'text-lotus-delivered' : 'text-lotus-accent') + '">' +
              escapeHtml(track.statusUtama) +
            '</span>' +
            (isDelivered ? '<span class="font-sans text-[11.5px] font-semibold text-lotus-delivered">&bull; Selesai</span>' : '') +
          '</div>' +
          '<span class="font-sans text-[11.5px] text-lotus-muted">In-App Live SPX</span>' +
        '</div>' +

        '<h3 class="editorial-heading text-[21px] sm:text-[23px] text-lotus-primary leading-[1.25] mb-6">' +
          escapeHtml(latest.deskripsi) +
        '</h3>' +

        '<div>' +
          '<div class="flex items-end justify-between gap-4 mb-2.5">' +
            '<div>' +
              '<span class="block font-sans text-[10px] font-semibold uppercase tracking-wider text-lotus-muted mb-0.5">Asal</span>' +
              '<p class="text-[15px] font-semibold text-lotus-primary leading-tight">' + escapeHtml(track.asal) + '</p>' +
            '</div>' +
            '<div class="text-right">' +
              '<span class="block font-sans text-[10px] font-semibold uppercase tracking-wider text-lotus-muted mb-0.5">Tujuan</span>' +
              '<p class="text-[15px] font-semibold text-lotus-primary leading-tight">' + escapeHtml(track.tujuan) + '</p>' +
            '</div>' +
          '</div>' +

          '<div class="route-track-bg relative w-full h-[2px] rounded-full my-2.5">' +
            '<div style="width:' + track.progress + '%;" class="route-progress-beam h-full rounded-full"></div>' +
            '<span style="left:' + track.progress + '%;" class="route-comet-dot absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full"></span>' +
          '</div>' +

          '<div class="flex items-center justify-between gap-3 text-[11.5px] text-lotus-secondary mt-2">' +
            '<span>' + (isDelivered ? 'Pengiriman selesai diterima' : 'Perjalanan paket terpantau real-time') + '</span>' +
            '<span class="font-sans text-[11.5px] font-semibold ' + (isDelivered ? 'text-lotus-delivered' : 'text-lotus-gold') + '">' + track.progress + '%</span>' +
          '</div>' +
        '</div>' +

        '<hr class="lotus-divider my-7" />' +

        '<div>' +
          '<div class="flex items-center justify-between mb-5">' +
            '<h4 class="font-sans text-[11px] font-semibold uppercase tracking-[0.08em] text-lotus-secondary">Riwayat Perjalanan</h4>' +
            '<span class="font-sans text-[11.5px] text-lotus-muted">' + track.riwayat.length + ' pembaruan</span>' +
          '</div>' +
          '<ol class="relative">';

      track.riwayat.forEach(function (ev, idx) {
        var isFirst = idx === 0;
        var isLast = idx === track.riwayat.length - 1;
        var dt = new Date(ev.waktu * 1000);
        var waktuStr = dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) +
          ', ' + dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        html +=
          '<li class="relative flex gap-3.5">' +
            '<div class="relative flex flex-col items-center w-4 shrink-0">' +
              (!isLast ? '<span class="timeline-vertical-line absolute top-4 bottom-0 w-[1px]"></span>' : '') +
              '<div class="relative w-4 h-4 mt-1 flex items-center justify-center">' +
                (isFirst
                  ? '<span class="timeline-active-node w-2.5 h-2.5 rounded-full"></span>'
                  : '<span class="timeline-past-node w-1.5 h-1.5 rounded-full"></span>') +
              '</div>' +
            '</div>' +
            '<div class="' + (isLast ? 'pb-0' : 'pb-6') + ' flex-1 min-w-0">' +
              '<div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5 mb-0.5">' +
                '<p class="text-[13.5px] leading-snug ' + (isFirst ? 'font-semibold text-lotus-primary' : 'font-medium text-lotus-primary opacity-85') + '">' +
                  escapeHtml(ev.deskripsi) +
                '</p>' +
                '<time class="font-sans text-[11.5px] shrink-0 ' + (isFirst ? 'text-lotus-gold font-semibold' : 'text-lotus-muted') + '">' +
                  waktuStr +
                '</time>' +
              '</div>' +
              (ev.lokasi ? '<p class="text-[12px] text-lotus-secondary mt-0.5">' + escapeHtml(ev.lokasi) + '</p>' : '') +
            '</div>' +
          '</li>';
      });

      html += '</ol></div>';
      el.drawerBody.innerHTML = html;
    }

    function closeTrackDrawer() {
      el.trackDrawerOverlay.classList.remove('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'true');
    }

    el.searchBtn.addEventListener('click', filterOrders);
    el.todayOngoingBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = 'ongoing';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      filterOrders();
    });
    el.clearBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = '';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      renderInitialEmptyState();
    });
    el.clearInputInlineBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.queryInput.focus();
    });
    el.brandResetBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    el.closeDrawerBtn.addEventListener('click', closeTrackDrawer);
    el.drawerBackdrop.addEventListener('click', closeTrackDrawer);
    el.drawerCopyBtn.addEventListener('click', function () {
      if (!activeDrawerResi) return;
      copyText(activeDrawerResi);
      el.drawerCopyLabel.textContent = 'Disalin';
      setTimeout(function () { el.drawerCopyLabel.textContent = 'Salin'; }, 1600);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeTrackDrawer();
    });

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    // Initialize Clean Empty State
    renderInitialEmptyState();
  </script>
