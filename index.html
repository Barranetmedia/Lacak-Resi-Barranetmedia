<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>larba. — Lacak Resi Barranetmedia</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Early Theme Restoration -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('larba_theme_mode');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ==========================================================================
       TWILIGHT LOTUS DUAL THEME TOKENS (DARK & LIGHT)
       ========================================================================== */
    :root {
      /* Mode Gelap (Twilight Lotus Dark) */
      --bg-base: #0C0918;
      --text-primary: #F7F5FC;
      --text-secondary: #A9A0C4;
      --text-muted: #746A94;

      --accent-primary: #8B96F2;
      --accent-secondary: #B78EF5;
      --accent-purple-dot: #A855F7;
      --accent-gold: #F6C856;
      --accent-gold-ring: rgba(246, 200, 86, 0.34);
      --accent-delivered: #6EE7B7;
      --accent-retur: #FDA4AF;

      --cta-gradient: linear-gradient(135deg, #7884E8, #B78EF5);
      --cta-text: #0C0918;
      --cta-shadow: 0 8px 24px -6px rgba(155, 132, 242, 0.45);
      --cta-shadow-hover: 0 10px 28px -4px rgba(183, 142, 245, 0.6);

      --route-gradient: linear-gradient(90deg, #7884E8 0%, #B78EF5 55%, #F6C856 100%);
      --route-gradient-retur: linear-gradient(90deg, #F59E0B 0%, #FB7185 55%, #F43F5E 100%);
      --route-track: rgba(227, 186, 245, 0.14);

      --hairline: rgba(227, 186, 245, 0.11);
      --zebra-alt: rgba(183, 142, 245, 0.045);
      --zebra-hover: rgba(183, 142, 245, 0.085);

      --pill-bg: rgba(255, 255, 255, 0.045);
      --pill-bg-hover: rgba(255, 255, 255, 0.085);
      --pill-border: rgba(227, 186, 245, 0.14);
      --badge-bg: rgba(120, 132, 232, 0.16);

      --search-line: rgba(227, 186, 245, 0.18);
      --search-focus: #B78EF5;

      --timeline-line: linear-gradient(180deg, rgba(246, 200, 86, 0.5) 0%, rgba(183, 142, 245, 0.32) 48%, rgba(120, 132, 232, 0.10) 100%);
      --timeline-dot-past: #8B96F2;

      --shimmer-base: rgba(227, 186, 245, 0.05);
      --shimmer-highlight: rgba(183, 142, 245, 0.14);

      --overlay-bg: rgba(6, 4, 13, 0.74);
      --sheet-bg: linear-gradient(180deg, rgba(23, 18, 48, 0.96) 0%, rgba(12, 9, 24, 0.99) 100%);
      --sheet-shadow: 0 -20px 60px rgba(6, 4, 13, 0.85);
      --toast-bg: rgba(24, 18, 52, 0.95);
      --toast-shadow: 0 12px 32px rgba(6, 4, 13, 0.72);
    }

    html.light {
      /* Mode Terang (Morning Lotus Light) */
      --bg-base: #FAF8FD;
      --text-primary: #141026;
      --text-secondary: #595175;
      --text-muted: #8B81A8;

      --accent-primary: #5663D1;
      --accent-secondary: #8C63DF;
      --accent-purple-dot: #7E22CE;
      --accent-gold: #D98A1C;
      --accent-gold-ring: rgba(217, 138, 28, 0.28);
      --accent-delivered: #0D9488;
      --accent-retur: #E11D48;

      --cta-gradient: linear-gradient(135deg, #5663D1, #8C63DF);
      --cta-text: #FFFFFF;
      --cta-shadow: 0 8px 22px -6px rgba(86, 99, 209, 0.36);
      --cta-shadow-hover: 0 10px 26px -4px rgba(140, 99, 223, 0.48);

      --route-gradient: linear-gradient(90deg, #5663D1 0%, #936CE8 55%, #D98A1C 100%);
      --route-gradient-retur: linear-gradient(90deg, #F59E0B 0%, #F43F5E 55%, #BE123C 100%);
      --route-track: rgba(20, 16, 38, 0.09);

      --hairline: rgba(20, 16, 38, 0.08);
      --zebra-alt: rgba(86, 99, 209, 0.04);
      --zebra-hover: rgba(86, 99, 209, 0.075);

      --pill-bg: rgba(20, 16, 38, 0.035);
      --pill-bg-hover: rgba(20, 16, 38, 0.07);
      --pill-border: rgba(20, 16, 38, 0.09);
      --badge-bg: rgba(86, 99, 209, 0.11);

      --search-line: rgba(20, 16, 38, 0.14);
      --search-focus: #5663D1;

      --timeline-line: linear-gradient(180deg, rgba(217, 138, 28, 0.45) 0%, rgba(140, 99, 223, 0.28) 50%, rgba(86, 99, 209, 0.10) 100%);
      --timeline-dot-past: #8C63DF;

      --shimmer-base: rgba(20, 16, 38, 0.045);
      --shimmer-highlight: rgba(86, 99, 209, 0.11);

      --overlay-bg: rgba(20, 16, 38, 0.32);
      --sheet-bg: linear-gradient(180deg, rgba(252, 250, 255, 0.96) 0%, rgba(243, 238, 249, 0.99) 100%);
      --sheet-shadow: 0 -18px 50px rgba(20, 16, 38, 0.14);
      --toast-bg: rgba(255, 255, 255, 0.96);
      --toast-shadow: 0 12px 30px rgba(20, 16, 38, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .atmosphere-dark {
      background-color: #0C0918;
      background-image:
        radial-gradient(ellipse 64% 42% at 20% 10%, rgba(111, 124, 230, 0.22) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 56% 36% at 55% -4%, rgba(155, 132, 242, 0.16) 0%, rgba(155, 132, 242, 0) 74%),
        radial-gradient(ellipse 48% 32% at 82% 8%, rgba(223, 183, 242, 0.11) 0%, rgba(223, 183, 242, 0) 72%),
        linear-gradient(180deg, #15102B 0%, #0F0B21 40%, #0C0918 100%);
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-dark {
      opacity: 0;
    }

    .atmosphere-light {
      background-color: #FAF8FD;
      background-image:
        radial-gradient(ellipse 64% 44% at 20% 8%, rgba(111, 124, 230, 0.11) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 54% 38% at 78% 6%, rgba(196, 152, 235, 0.15) 0%, rgba(196, 152, 235, 0) 74%),
        linear-gradient(180deg, #F3EEF9 0%, #F7F4FC 42%, #FAF8FD 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-light {
      opacity: 1;
    }

    .editorial-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .text-lotus-primary { color: var(--text-primary); }
    .text-lotus-secondary { color: var(--text-secondary); }
    .text-lotus-muted { color: var(--text-muted); }
    .text-lotus-accent { color: var(--accent-primary); }
    .text-lotus-gold { color: var(--accent-gold); }
    .text-lotus-delivered { color: var(--accent-delivered); }
    .text-lotus-retur { color: var(--accent-retur); }

    .lotus-pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      transition: background-color 0.25s ease, border-color 0.35s ease, color 0.35s ease;
    }

    .lotus-pill:hover {
      background-color: var(--pill-bg-hover);
    }

    .lotus-divider {
      border: 0;
      border-top: 1px solid var(--hairline);
    }

    .lotus-cta-btn {
      background: var(--cta-gradient);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .lotus-cta-btn:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: var(--cta-shadow-hover);
    }

    .lotus-cta-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .lotus-cta-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Borderless Search Underline */
    .search-underline {
      border-bottom: 1px solid var(--search-line);
      transition: border-color 0.3s ease;
    }

    .search-underline:focus-within {
      border-bottom-color: var(--search-focus);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.85;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }
    html.light input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
    }

    select option {
      background-color: #171230;
      color: #F7F5FC;
    }
    html.light select option {
      background-color: #FAF8FD;
      color: #141026;
    }

    /* Cardless Alternating Zebra Rows */
    .zebra-row {
      transition: background-color 0.2s ease;
    }
    .zebra-row:nth-child(even) {
      background-color: var(--zebra-alt);
    }
    .zebra-row:hover {
      background-color: var(--zebra-hover);
    }

    /* Radar Dot Pulse */
    @keyframes goldRadarPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 0 6px rgba(246, 200, 86, 0);
      }
    }

    .radar-pulse-dot {
      background-color: var(--accent-gold);
      animation: goldRadarPulse 2.6s ease-in-out infinite;
    }

    /* Route Progress Track */
    .route-track-bg {
      background-color: var(--route-track);
    }

    .route-progress-beam {
      background: var(--route-gradient);
    }

    .route-comet-dot {
      background-color: var(--accent-gold);
      box-shadow: 0 0 10px 2px var(--accent-gold-ring), 0 0 4px 1px var(--accent-gold);
    }

    /* Varian RETUR (progress bar merah) */
    .route-progress-beam-retur {
      background: var(--route-gradient-retur);
    }

    .route-comet-dot-retur {
      background-color: var(--accent-retur);
      box-shadow: 0 0 10px 2px rgba(244, 63, 94, 0.42), 0 0 4px 1px var(--accent-retur);
    }

    /* Vertical Timeline */
    .timeline-vertical-line {
      background: var(--timeline-line);
    }

    @keyframes checkpointHalo {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 4px var(--accent-gold-ring), 0 0 12px var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.14);
        box-shadow: 0 0 0 8px rgba(246, 200, 86, 0), 0 0 16px var(--accent-gold-ring);
      }
    }

    .timeline-active-node {
      background-color: var(--accent-gold);
      animation: checkpointHalo 2.5s ease-in-out infinite;
    }

    .timeline-past-node {
      background-color: var(--timeline-dot-past);
    }

    /* Lightweight Shimmer */
    @keyframes lotusShimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer-bar {
      background: linear-gradient(
        90deg,
        var(--shimmer-base) 25%,
        var(--shimmer-highlight) 50%,
        var(--shimmer-base) 75%
      );
      background-size: 200% 100%;
      animation: lotusShimmer 1.1s ease-in-out infinite;
    }

    /* Slide-Up Frosted Bottom Sheet */
    .drawer-overlay {
      background-color: var(--overlay-bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .drawer-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-sheet {
      background: var(--sheet-bg);
      border-top: 1px solid var(--pill-border);
      box-shadow: var(--sheet-shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drawer-overlay.is-open .drawer-sheet {
      transform: translateY(0);
    }

    /* Floating Toast */
    .lotus-toast {
      background-color: var(--toast-bg);
      border: 1px solid var(--pill-border);
      box-shadow: var(--toast-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="relative min-h-[100dvh] selection:bg-[#8B96F2]/25">

  <!-- Full-Viewport Dual Atmospheric Background Layers -->
  <div class="atmosphere-dark fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>
  <div class="atmosphere-light fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>

  <!-- Adaptive Container: Single-Column on Mobile, Proportional 2-Column on Desktop -->
  <div class="relative z-10 w-full max-w-[1040px] mx-auto px-5 sm:px-8 pt-8 pb-24">

    <!-- 1. Top Header -->
    <header class="flex items-center justify-between gap-3 pb-7 mb-9 border-b border-[var(--hairline)]">
      <!-- Clean Brand Wordmark ('larba.') with Purple Dot -->
      <button
        id="brandResetBtn"
        type="button"
        class="inline-flex items-baseline focus:outline-none cursor-pointer"
        aria-label="larba."
      >
        <span class="editorial-heading text-[26px] text-lotus-primary leading-none">larba</span>
        <span style="color: var(--accent-purple-dot);" class="editorial-heading text-[28px] leading-none">.</span>
      </button>

      <!-- Right Controls: Theme Switcher & Active Status Pill -->
      <div class="flex items-center gap-2.5">
        <button
          id="themeToggleBtn"
          type="button"
          class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-primary cursor-pointer"
        >
          <svg id="iconSun" class="w-3.5 h-3.5 text-lotus-gold shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="iconMoon" class="hidden w-3.5 h-3.5 text-lotus-accent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <span id="themeToggleLabel">Mode Terang</span>
        </button>

        <div id="authBadgePill" class="lotus-pill hidden items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-secondary">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6EE7B7]"></span>
          <span>Barranetmedia</span>
        </div>
      </div>
    </header>

    <!-- Main 2-Column Desktop Grid (5 Cols Left Controls / 7 Cols Right Cardless Results) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-start">

      <!-- LEFT COLUMN (5 Cols on Desktop): Editorial Title, Login & Borderless Search -->
      <aside class="lg:col-span-5 lg:sticky lg:top-8">
        <!-- Professional Eyebrow Badge -->
        <div class="lotus-pill inline-flex items-center gap-2 px-3 py-1 rounded-full mb-4">
          <span class="w-1.5 h-1.5 rounded-full radar-pulse-dot shrink-0"></span>
          <span class="font-sans text-[11px] font-semibold tracking-[0.06em] uppercase text-lotus-primary">
            Rahasia Perusahaan
          </span>
        </div>

        <!-- Headline & Subtitle -->
        <h1 class="editorial-heading text-[28px] sm:text-[32px] text-lotus-primary mb-2">
          Lacak Resi Barranetmedia
        </h1>
        <p class="text-[14px] leading-relaxed text-lotus-secondary mb-7">
          Selamat berjuang sukses...
        </p>

        <!-- LOGIN PANEL (Shown before Google OAuth verification) -->
        <div id="loginPanel" class="py-4 border-t border-[var(--hairline)]">
          <p class="text-[13.5px] font-semibold text-lotus-primary mb-1">Login Akun Google</p>
          <p class="text-[12.5px] text-lotus-secondary mb-4">
            Gunakan email Google yang terdaftar untuk mengakses data resi.
          </p>
          <div id="googleSignInBtn"></div>
          <p id="loginStatus" class="font-sans text-[12px] font-medium text-lotus-gold mt-3.5"></p>
        </div>

        <!-- SEARCH & FILTER PANEL (Shown after Google OAuth verification) -->
        <div id="searchPanel" style="display:none;">
          <!-- Borderless Multi-Query Search Input -->
          <div class="search-underline pb-3">
            <div class="flex items-start gap-2">
              <textarea
                id="queryInput"
                rows="2"
                spellcheck="false"
                placeholder="Cari resi, nama, atau no HP (pisahkan koma / baris baru)..."
                class="w-full min-w-0 bg-transparent font-sans text-[14px] leading-relaxed text-lotus-primary focus:outline-none resize-y"
              ></textarea>
              <button
                id="clearInputInlineBtn"
                type="button"
                aria-label="Hapus kata kunci"
                class="text-lotus-secondary hover:text-lotus-primary text-lg leading-none px-1.5 py-0.5 transition-colors cursor-pointer shrink-0"
              >
                &times;
              </button>
            </div>
          </div>

          <!-- Clean Underline Filter Grid (No Heavy Boxes) -->
          <div class="grid grid-cols-2 gap-x-5 gap-y-4 mt-5">
            <div class="search-underline pb-2">
              <label for="csInput" class="block font-sans text-[11px] font-semibold uppercase tracking-wider text-lotus-muted mb-1">CS</label>
              <input
                type="text"
                id="csInput"
                placeholder="Semua CS"
                class="w-full bg-transparent text-[13px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>

            <div class="search-underline pb-2">
              <label for="statusInput" class="block font-sans text-[11px] font-semibold uppercase tracking-wider text-lotus-muted mb-1">Status</label>
              <select
                id="statusInput"
                class="w-full bg-transparent text-[13px] font-medium text-lotus-primary focus:outline-none cursor-pointer"
              >
                <option value="">Semua status</option>
                <option value="ongoing">On going</option>
                <option value="delivered">Delivered</option>
                <option value="retur">Retur</option>
              </select>
            </div>

            <div class="search-underline pb-2">
              <label for="dateFromInput" class="block font-sans text-[11px] font-semibold uppercase tracking-wider text-lotus-muted mb-1">Dari Tanggal</label>
              <input
                type="date"
                id="dateFromInput"
                class="w-full bg-transparent text-[12.5px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>

            <div class="search-underline pb-2">
              <label for="dateToInput" class="block font-sans text-[11px] font-semibold uppercase tracking-wider text-lotus-muted mb-1">Sampai Tanggal</label>
              <input
                type="date"
                id="dateToInput"
                class="w-full bg-transparent text-[12.5px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-wrap items-center gap-2.5 mt-6">
            <button
              id="searchBtn"
              type="button"
              class="lotus-cta-btn font-bold text-[13px] px-5 py-2.5 rounded-full cursor-pointer"
            >
              Cari Resi
            </button>

            <button
              id="todayOngoingBtn"
              type="button"
              class="lotus-pill text-[12.5px] font-medium text-lotus-primary px-4 py-2.5 rounded-full cursor-pointer"
            >
              Semua ongoing
            </button>

            <button
              id="clearBtn"
              type="button"
              class="text-[12.5px] font-medium text-lotus-secondary hover:text-lotus-primary px-2.5 py-2 transition-colors cursor-pointer"
            >
              Bersihkan
            </button>
          </div>
        </div>
      </aside>

      <!-- RIGHT COLUMN (7 Cols on Desktop): Cardless Zebra-Striped Results Stream -->
      <main aria-label="Daftar Resi Pengiriman" class="lg:col-span-7 lg:border-l lg:border-[var(--hairline)] lg:pl-10">
        <div class="flex items-center justify-between gap-2 pb-3.5 border-b border-[var(--hairline)]">
          <h2 class="font-sans text-[12px] font-semibold uppercase tracking-[0.08em] text-lotus-secondary">
            Daftar Resi
          </h2>
          <span id="statusLine" class="font-sans text-[12px] font-medium text-lotus-muted">
            Menunggu pencarian
          </span>
        </div>

        <!-- Lightweight Shimmer Skeleton -->
        <div id="searchShimmer" class="hidden space-y-5 py-6" aria-hidden="true">
          <div class="space-y-2.5">
            <div class="h-4 w-40 rounded-full shimmer-bar"></div>
            <div class="h-5 w-64 rounded shimmer-bar"></div>
            <div class="h-3 w-48 rounded shimmer-bar"></div>
          </div>
          <hr class="lotus-divider" />
          <div class="space-y-2.5">
            <div class="h-4 w-36 rounded-full shimmer-bar"></div>
            <div class="h-5 w-56 rounded shimmer-bar"></div>
            <div class="h-3 w-52 rounded shimmer-bar"></div>
          </div>
        </div>

        <!-- Cardless Alternating Zebra List Container -->
        <div id="resultsArea" class="divide-y divide-[var(--hairline)]"></div>
      </main>

    </div>
  </div>

  <!-- SLIDE-UP FROSTED BOTTOM SHEET ('In-App Live SPX Tracking') -->
  <div
    id="trackDrawerOverlay"
    aria-hidden="true"
    class="drawer-overlay fixed inset-0 z-50 backdrop-blur-sm flex flex-col justify-end items-center"
  >
    <div id="drawerBackdrop" class="w-full flex-1"></div>

    <div
      role="dialog"
      aria-modal="true"
      aria-label="Detail Perjalanan Paket"
      class="drawer-sheet w-full max-w-[580px] max-h-[86vh] rounded-t-3xl px-6 pt-4 pb-10 flex flex-col"
    >
      <div style="background-color: var(--hairline);" class="w-10 h-1 rounded-full mx-auto mb-5 shrink-0"></div>

      <div style="border-bottom: 1px solid var(--hairline);" class="flex items-center justify-between gap-3 pb-4 shrink-0">
        <div class="inline-flex items-center gap-2 flex-wrap">
          <span class="text-[13px] font-semibold text-lotus-accent">SPX Express</span>
          <span class="text-lotus-muted">&middot;</span>
          <span id="drawerResiCode" class="font-sans text-[14px] font-semibold text-lotus-primary tracking-wide">-</span>
          <button
            id="drawerCopyBtn"
            type="button"
            class="inline-flex items-center gap-1 text-[11.5px] font-medium text-lotus-secondary hover:text-lotus-primary transition-colors cursor-pointer ml-1"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="drawerCopyLabel">Salin</span>
          </button>
        </div>

        <button
          id="closeDrawerBtn"
          type="button"
          class="lotus-pill text-[12px] font-medium text-lotus-secondary hover:text-lotus-primary px-3 py-1 rounded-full cursor-pointer"
        >
          Tutup
        </button>
      </div>

      <div id="drawerBody" class="overflow-y-auto pt-6 pr-1"></div>
    </div>
  </div>

  <!-- Subtle Floating Toast -->
  <div
    id="toastBanner"
    role="status"
    aria-live="polite"
    class="pointer-events-none fixed bottom-6 left-1/2 -translate-x-1/2 z-50 opacity-0 translate-y-2 transition-all duration-200"
  >
    <div class="lotus-toast inline-flex items-center gap-2 px-4 py-2 rounded-full text-[12.5px] font-medium text-lotus-primary whitespace-nowrap">
      <span style="background-color: var(--accent-gold);" class="w-1.5 h-1.5 rounded-full"></span>
      <span id="toastText">Nomor resi disalin</span>
    </div>
  </div>

  <script>
    /**
     * larba. — Lacak Resi Barranetmedia (Production Frontend connected to Google Sheets & SPX)
     */
    var API_URL = "https://script.google.com/macros/s/AKfycbyZo8dEMfDcS84-WDwZiZeZS-WzdAwLOAyr_lU1TAovOZdW7PV0Qh338mhNJRDOKua1oA/exec";
    var GOOGLE_CLIENT_ID = "315770296664-pkethfkpdhd9bqj1lnjj0ec06eos8rlv.apps.googleusercontent.com";

    var ID_TOKEN = null;
    var SESSION = null;
    try { SESSION = localStorage.getItem('larba_session'); } catch (e) {}

    var expandedRows = {};
    var lastData = null;
    var trackingCache = {};
    var activeDrawerResi = "";
    var toastTimer = null;
    var drawerOpen = false;

    var el = {
      brandResetBtn: document.getElementById('brandResetBtn'),
      themeToggleBtn: document.getElementById('themeToggleBtn'),
      themeToggleLabel: document.getElementById('themeToggleLabel'),
      iconSun: document.getElementById('iconSun'),
      iconMoon: document.getElementById('iconMoon'),
      authBadgePill: document.getElementById('authBadgePill'),

      loginPanel: document.getElementById('loginPanel'),
      loginStatus: document.getElementById('loginStatus'),
      searchPanel: document.getElementById('searchPanel'),

      queryInput: document.getElementById('queryInput'),
      clearInputInlineBtn: document.getElementById('clearInputInlineBtn'),
      csInput: document.getElementById('csInput'),
      statusInput: document.getElementById('statusInput'),
      dateFromInput: document.getElementById('dateFromInput'),
      dateToInput: document.getElementById('dateToInput'),

      searchBtn: document.getElementById('searchBtn'),
      todayOngoingBtn: document.getElementById('todayOngoingBtn'),
      clearBtn: document.getElementById('clearBtn'),
      statusLine: document.getElementById('statusLine'),
      searchShimmer: document.getElementById('searchShimmer'),
      resultsArea: document.getElementById('resultsArea'),

      trackDrawerOverlay: document.getElementById('trackDrawerOverlay'),
      drawerBackdrop: document.getElementById('drawerBackdrop'),
      closeDrawerBtn: document.getElementById('closeDrawerBtn'),
      drawerResiCode: document.getElementById('drawerResiCode'),
      drawerCopyBtn: document.getElementById('drawerCopyBtn'),
      drawerCopyLabel: document.getElementById('drawerCopyLabel'),
      drawerBody: document.getElementById('drawerBody'),

      toastBanner: document.getElementById('toastBanner'),
      toastText: document.getElementById('toastText')
    };

    /* ========================================================================
       1. DUAL THEME SWITCHER (Twilight Lotus Dark <-> Morning Lotus Light)
       ======================================================================== */
    function syncThemeUI() {
      var isLight = document.documentElement.classList.contains('light');
      if (isLight) {
        el.iconSun.classList.add('hidden');
        el.iconMoon.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Gelap';
      } else {
        el.iconMoon.classList.add('hidden');
        el.iconSun.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Terang';
      }
    }

    function toggleTheme() {
      var root = document.documentElement;
      var switchingToLight = !root.classList.contains('light');
      if (switchingToLight) {
        root.classList.remove('dark');
        root.classList.add('light');
      } else {
        root.classList.remove('light');
        root.classList.add('dark');
      }
      try {
        localStorage.setItem('larba_theme_mode', switchingToLight ? 'light' : 'dark');
      } catch (e) {}
      syncThemeUI();
      showToast(switchingToLight ? 'Beralih ke Mode Terang' : 'Beralih ke Mode Gelap');
    }

    el.themeToggleBtn.addEventListener('click', toggleTheme);
    syncThemeUI();

    function showToast(message) {
      el.toastText.textContent = message;
      el.toastBanner.classList.remove('opacity-0', 'translate-y-2');
      el.toastBanner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.toastBanner.classList.remove('opacity-100', 'translate-y-0');
        el.toastBanner.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function copyText(text) {
      var temp = document.createElement('textarea');
      temp.value = text;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        showToast('Nomor resi disalin');
      } catch (e) {
        showToast('Gagal menyalin resi');
      }
      document.body.removeChild(temp);
    }

    function renderEmptyState() {
      el.statusLine.textContent = 'Menunggu pencarian';
      el.resultsArea.innerHTML =
        '<div class="py-16 px-4 text-center">' +
          '<p class="text-[14px] font-semibold text-lotus-primary">Belum ada data resi ditampilkan</p>' +
          '<p class="text-[12.5px] text-lotus-muted mt-1">Masukkan nomor resi, nama pelanggan, atau no HP lalu tekan Cari Resi.</p>' +
        '</div>';
    }

    /* ========================================================================
       2. GOOGLE OAUTH SIGN-IN, SESI 30 HARI & JSONP BACKEND CONNECTION
       ======================================================================== */
    function authParams() {
      return SESSION ? { session: SESSION } : { token: ID_TOKEN };
    }

    function showApp() {
      el.loginPanel.style.display = 'none';
      el.searchPanel.style.display = '';
      el.authBadgePill.classList.remove('hidden');
      el.authBadgePill.classList.add('sm:inline-flex');
    }

    function logout() {
      SESSION = null;
      ID_TOKEN = null;
      try { localStorage.removeItem('larba_session'); } catch (e) {}
      el.searchPanel.style.display = 'none';
      el.loginPanel.style.display = '';
      el.authBadgePill.classList.add('hidden');
      el.authBadgePill.classList.remove('sm:inline-flex');
      if (drawerOpen) hideDrawer();
    }

    window.onload = function () {
      renderEmptyState();

      // Jika ada sesi tersimpan, cek ke server lalu langsung masuk tanpa login ulang
      if (SESSION) {
        jsonpRequest({ action: 'ping' }, function (err, data) {
          if (!err && data && data.success) showApp();
        });
      }

      if (typeof google === 'undefined') return;
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleSignIn,
        auto_select: true
      });
      google.accounts.id.renderButton(
        document.getElementById('googleSignInBtn'),
        { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' }
      );
      if (!SESSION) google.accounts.id.prompt();
    };

    function jsonpRequest(params, callback) {
      params = Object.assign({}, params, authParams());
      var callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      var script = document.createElement('script');
      window[callbackName] = function (data) {
        delete window[callbackName];
        if (script.parentNode) document.body.removeChild(script);
        // Sesi habis / tidak valid -> kembali ke layar login
        if (data && data.authError && params.action !== 'login') {
          logout();
          showToast('Sesi berakhir, silakan login ulang');
        }
        callback(null, data);
      };
      var query = Object.keys(params).map(function (k) {
        return k + '=' + encodeURIComponent(params[k]);
      }).join('&');
      script.src = API_URL + '?' + query + '&callback=' + callbackName;
      script.onerror = function () {
        delete window[callbackName];
        if (script.parentNode) document.body.removeChild(script);
        callback(new Error('Gagal memuat data dari server.'));
      };
      document.body.appendChild(script);
    }

    function handleGoogleSignIn(response) {
      ID_TOKEN = response.credential;
      SESSION = null;
      el.loginStatus.textContent = 'Memeriksa akses...';

      jsonpRequest({ action: 'login' }, function (err, data) {
        if (err) {
          el.loginStatus.textContent = 'Gagal terhubung: ' + err.message;
          return;
        }
        if (!data.success) {
          el.loginStatus.textContent = data.error;
          ID_TOKEN = null;
          return;
        }
        SESSION = data.session;
        ID_TOKEN = null;
        try { localStorage.setItem('larba_session', SESSION); } catch (e) {}
        el.loginStatus.textContent = '';
        showApp();
      });
    }

    /* ========================================================================
       3. SEARCH & RENDERING CARDLESS ZEBRA-STRIPED ROWS
       ======================================================================== */
    function getStatusMeta(status) {
      var s = (status || '').toLowerCase();
      if (s.indexOf('deliver') !== -1) {
        return { label: status, colorClass: 'text-lotus-delivered', dotColor: 'var(--accent-delivered)' };
      }
      if (s.indexOf('ongoing') !== -1 || s.indexOf('on going') !== -1 || s.indexOf('on-going') !== -1 || s.indexOf('proses') !== -1) {
        return { label: status, colorClass: 'text-lotus-gold', dotColor: 'var(--accent-gold)' };
      }
      if (s.indexOf('retur') !== -1) {
        return { label: status, colorClass: 'text-lotus-retur', dotColor: 'var(--accent-retur)' };
      }
      return { label: status || 'Lainnya', colorClass: 'text-lotus-accent', dotColor: 'var(--accent-primary)' };
    }

    function buildWaMessage(item) {
      return "Halo Kak " + item.nama + " \uD83D\uDC4B\n\n" +
        "\uD83D\uDCE6 Nomor Resi Pesanan " + item.produk + ":\n" +
        item.resi + "\n\n" +
        "Mohon pastikan nomor resi pada paket sama dengan nomor di atas saat paket diterima.\n\n" +
        "Cek posisi paket di sini:\n" +
        item.linkResi + "\n\n" +
        "Terima kasih \uD83D\uDE4F";
    }

    function waLink(item) {
      var phone = String(item.noHp).replace(/\D/g, '');
      var normalized = phone.charAt(0) === '0'
        ? '62' + phone.slice(1)
        : (phone.indexOf('62') === 0 ? phone : '62' + phone);
      return 'https://wa.me/' + normalized + '?text=' + encodeURIComponent(buildWaMessage(item));
    }

    function searchResi() {
      var raw = el.queryInput.value.trim();
      var cs = el.csInput.value.trim();
      var status = el.statusInput.value;
      var dateFrom = el.dateFromInput.value;
      var dateTo = el.dateToInput.value;

      if (!raw && !cs && !status && !dateFrom && !dateTo) {
        el.statusLine.textContent = 'Masukkan kata kunci atau filter';
        showToast('Isi kata kunci atau pilih filter dulu');
        return;
      }

      el.searchBtn.disabled = true;
      el.statusLine.textContent = 'Mencari...';
      el.resultsArea.innerHTML = '';
      el.searchShimmer.classList.remove('hidden');

      jsonpRequest({
        q: raw,
        cs: cs,
        status: status,
        dateFrom: dateFrom,
        dateTo: dateTo
      }, function (err, data) {
        el.searchBtn.disabled = false;
        el.searchShimmer.classList.add('hidden');

        if (err) {
          el.statusLine.textContent = 'Gagal terhubung';
          showToast(err.message);
          return;
        }
        if (!data.success) {
          el.statusLine.textContent = 'Terjadi kesalahan';
          showToast(data.error);
          return;
        }
        el.statusLine.textContent = data.total + ' hasil ditemukan';
        renderResults(data);
      });
    }

    function toggleRowDetail(resiId) {
      expandedRows[resiId] = !expandedRows[resiId];
      if (lastData) renderResults(lastData);
    }

    function renderResults(data) {
      lastData = data;
      var html = '';

      // Info jika ada kata kunci yang tidak ditemukan di Google Sheet
      if (data.notFound && data.notFound.length > 0) {
        html += '<div class="py-3.5 px-4 mb-2 rounded-xl lotus-pill text-[12px] text-lotus-retur flex flex-wrap items-center justify-between gap-2">' +
          '<span>Tidak ditemukan di sheet: <strong>' + data.notFound.map(escapeHtml).join(', ') + '</strong></span>';

        // Jika kata kunci berbentuk nomor resi SPX, berikan opsi lacak langsung ke SPX
        var directSpx = data.notFound.find(function (q) {
          return /^spx/i.test(q.trim());
        });
        if (directSpx) {
          var cleanDirect = directSpx.trim().toUpperCase();
          html += '<button type="button" onclick="openLiveTrack(\'' + cleanDirect.replace(/'/g, "\\'") + '\', \'https://spx.co.id/track?' + cleanDirect.replace(/'/g, "\\'") + '\')" class="underline font-semibold text-lotus-accent hover:text-lotus-primary cursor-pointer">' +
            'Lacak langsung ' + escapeHtml(cleanDirect) + ' &rarr;' +
          '</button>';
        }
        html += '</div>';
      }

      if (!data.data || data.data.length === 0) {
        html += '<div class="py-14 px-4 text-center">' +
          '<p class="text-[14.5px] font-semibold text-lotus-primary">Tidak ada data yang cocok</p>' +
          '<p class="text-[12.5px] text-lotus-secondary mt-1">Periksa kembali nomor resi, nama, atau filter tanggal.</p>' +
        '</div>';
        el.resultsArea.innerHTML = html;
        return;
      }

      html += data.data.map(function (item) {
        var meta = getStatusMeta(item.status);
        var isOpen = !!expandedRows[item.resi];
        var hargaFmt = 'Rp' + Number(item.harga || 0).toLocaleString('id-ID');
        var resiTarget = item.resi || item.linkResi;
        var safeResi = resiTarget.replace(/'/g, "\\'");
        var safeLink = (item.linkResi || ('https://spx.co.id/track?' + item.resi)).replace(/'/g, "\\'");

        return (
          '<article class="zebra-row px-3.5 sm:px-4 py-4 rounded-lg">' +
            // Baris 1: Nomor Resi (Plus Jakarta Sans) + Status + Tanggal & CS
            '<div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">' +
              '<div class="inline-flex items-center gap-2 flex-wrap">' +
                '<span style="background-color:' + meta.dotColor + ';" class="w-1.5 h-1.5 rounded-full shrink-0"></span>' +
                '<button type="button" onclick="copyText(\'' + safeResi + '\')" class="font-sans text-[14.5px] font-bold tracking-[0.02em] text-lotus-primary hover:text-lotus-accent transition-colors cursor-pointer" title="Salin resi">' +
                  escapeHtml(item.resi) +
                '</button>' +
                '<span class="text-lotus-muted">&middot;</span>' +
                '<span class="font-sans text-[11.5px] font-semibold uppercase tracking-wide ' + meta.colorClass + '">' +
                  escapeHtml(meta.label) +
                '</span>' +
              '</div>' +

              '<div class="font-sans text-[12px] text-lotus-secondary">' +
                escapeHtml(item.tanggal) +
                (item.cs ? ' <span class="text-lotus-muted">&middot;</span> ' + escapeHtml(item.cs) : '') +
              '</div>' +
            '</div>' +

            // Baris 2: Nama Pelanggan + No HP + Harga
            '<div class="flex flex-wrap items-baseline justify-between gap-2 mb-1">' +
              '<p class="text-[14px] font-semibold text-lotus-primary">' +
                escapeHtml(item.nama) +
                (item.noHp ? ' <span class="font-sans text-[12.5px] font-normal text-lotus-secondary">&middot; ' + escapeHtml(item.noHp) + '</span>' : '') +
              '</p>' +
              '<span class="font-sans text-[13px] font-semibold text-lotus-gold">' + hargaFmt + '</span>' +
            '</div>' +

            // Baris 3: Produk & Alamat
            '<p class="text-[13px] text-lotus-secondary leading-relaxed ' + (isOpen ? '' : 'truncate') + '">' +
              escapeHtml(item.produk) +
              (item.alamat ? ' <span class="text-lotus-muted">&mdash;</span> ' + escapeHtml(item.alamat) : '') +
            '</p>' +

            // Baris 4: Tombol Aksi
            '<div class="flex items-center justify-between gap-3 mt-3">' +
              '<div class="flex items-center gap-2 flex-wrap">' +
                (resiTarget
                  ? '<button type="button" onclick="openLiveTrack(\'' + safeResi + '\', \'' + safeLink + '\')" class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-semibold text-lotus-accent hover:text-lotus-primary cursor-pointer">' +
                      '<span class="w-1.5 h-1.5 rounded-full radar-pulse-dot"></span>' +
                      '<span>Lacak Paket</span>' +
                    '</button>'
                  : '') +
                (item.noHp
                  ? '<a href="' + waLink(item) + '" target="_blank" rel="noopener" class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-medium text-lotus-delivered hover:opacity-90">' +
                      '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.16-.29.36-.42.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.37-.23.62-.14.25.09 1.6.76 1.87.9.28.14.46.21.53.32.07.12.07.68-.17 1.36z"/></svg>' +
                      '<span>WhatsApp</span>' +
                    '</a>'
                  : '') +
                '<button type="button" onclick="copyText(\'' + safeResi + '\')" class="text-[12px] font-medium text-lotus-secondary hover:text-lotus-primary px-2 py-1 transition-colors cursor-pointer">' +
                  'Salin' +
                '</button>' +
              '</div>' +

              '<button type="button" onclick="toggleRowDetail(\'' + item.resi.replace(/'/g, "\\'") + '\')" class="inline-flex items-center gap-1 text-[11.5px] font-medium text-lotus-muted hover:text-lotus-primary transition-colors cursor-pointer">' +
                '<span>' + (isOpen ? 'Ringkas' : 'Detail') + '</span>' +
                '<svg class="w-3.5 h-3.5 transition-transform duration-150 ' + (isOpen ? 'rotate-180' : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
              '</button>' +
            '</div>' +
          '</article>'
        );
      }).join('');

      el.resultsArea.innerHTML = html;
    }

    /* ========================================================================
       4. SLIDE-UP FROSTED BOTTOM SHEET — IN-APP LIVE SPX TRACKING
       ======================================================================== */
    function extractCityName(locationStr) {
      if (!locationStr) return '';
      var cleaned = locationStr
        .replace(/\b(First Mile Hub|Last Mile Hub|Sorting Center|Gateway|Hub|DC)\b/gi, '')
        .replace(/\d+/g, '')
        .trim();
      return cleaned || locationStr;
    }

    function openLiveTrack(resiOrUrl, fallbackLink) {
      var cleanResi = resiOrUrl.indexOf('?') !== -1
        ? resiOrUrl.split('?')[1].split('&')[0].trim()
        : resiOrUrl.trim();

      activeDrawerResi = cleanResi;
      el.drawerResiCode.textContent = cleanResi;
      el.drawerCopyLabel.textContent = 'Salin';
      el.trackDrawerOverlay.classList.add('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'false');

      // Tambah entri riwayat agar tombol Back ponsel menutup pop-up (bukan menutup Chrome)
      if (!drawerOpen) {
        history.pushState({ drawer: true }, '');
        drawerOpen = true;
      }

      if (trackingCache[cleanResi]) {
        renderDrawerTracking(trackingCache[cleanResi], fallbackLink);
        return;
      }

      el.drawerBody.innerHTML =
        '<div class="space-y-5 py-2" aria-hidden="true">' +
          '<div class="h-3.5 w-32 rounded-full shimmer-bar"></div>' +
          '<div class="h-7 w-3/4 rounded-lg shimmer-bar"></div>' +
          '<div class="h-3 w-1/2 rounded-full shimmer-bar"></div>' +
          '<div class="pt-3 space-y-2.5">' +
            '<div class="flex justify-between"><div class="h-4 w-20 rounded shimmer-bar"></div><div class="h-4 w-20 rounded shimmer-bar"></div></div>' +
            '<div class="h-[2px] w-full rounded-full shimmer-bar"></div>' +
          '</div>' +
          '<hr class="lotus-divider my-6" />' +
          '<div class="space-y-4">' +
            '<div class="h-10 w-full rounded-lg shimmer-bar"></div>' +
            '<div class="h-10 w-5/6 rounded-lg shimmer-bar"></div>' +
            '<div class="h-10 w-4/6 rounded-lg shimmer-bar"></div>' +
          '</div>' +
        '</div>';

      jsonpRequest({ action: 'track', resi: cleanResi }, function (err, res) {
        if (err || !res || !res.success) {
          var msg = (err && err.message) || (res && res.error) || 'Data pelacakan SPX belum tersedia.';
          el.drawerBody.innerHTML =
            '<div class="py-10 text-center">' +
              '<p class="text-[14px] font-medium text-lotus-retur mb-2">' + escapeHtml(msg) + '</p>' +
              '<p class="text-[12.5px] text-lotus-secondary mb-5">Anda tetap dapat mengeceknya langsung melalui situs resmi SPX.</p>' +
              '<a href="' + escapeHtml(fallbackLink) + '" target="_blank" rel="noopener" class="lotus-cta-btn inline-flex items-center gap-1.5 text-[12.5px] font-bold px-5 py-2.5 rounded-full">' +
                '<span>Buka spx.co.id</span>' +
                '<span>&nearr;</span>' +
              '</a>' +
            '</div>';
          return;
        }

        trackingCache[cleanResi] = res;
        renderDrawerTracking(res, fallbackLink);
      });
    }

    function renderDrawerTracking(data, fallbackLink) {
      var riwayat = data.riwayat || [];
      var isDelivered = (data.statusUtama || '').toLowerCase().indexOf('deliver') !== -1;
      var isRetur = /retur|return/i.test(data.statusUtama || '') ||
        riwayat.some(function (r) {
          return /retur|return/i.test((r.deskripsi || '') + ' ' + (r.milestone || ''));
        });
      var accentCls = isRetur ? 'text-lotus-retur' : (isDelivered ? 'text-lotus-delivered' : 'text-lotus-accent');
      var latest = riwayat[0] || {};
      var latestCode = latest.milestoneCode || 1;

      var progressPct = 22;
      if (isDelivered || latestCode >= 8) progressPct = 100;
      else if (latestCode >= 6) progressPct = 88;
      else if (latestCode >= 5) progressPct = 68;
      else if (latestCode >= 4) progressPct = 42;

      var originCity = 'Pengirim';
      for (var i = riwayat.length - 1; i >= 0; i--) {
        if (riwayat[i].lokasi) {
          originCity = extractCityName(riwayat[i].lokasi);
          break;
        }
      }
      var destinationCity = latest.lokasi ? extractCityName(latest.lokasi) : 'Tujuan';

      var latestTimeStr = '';
      if (latest.waktu) {
        var dLatest = new Date(latest.waktu * 1000);
        latestTimeStr = dLatest.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) +
          ', ' + dLatest.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
      }

      var statusTagLabel = isRetur ? 'Retur' : (isDelivered ? 'Terkirim' : (data.statusUtama || 'Dalam Perjalanan'));
      var headlineText = latest.deskripsi || (isDelivered ? 'Paket telah diterima di alamat tujuan' : 'Paket sedang dalam proses pengiriman');

      var html =
        '<div class="mb-2 flex items-center justify-between gap-2">' +
          '<div class="flex items-center gap-2">' +
            '<span class="font-sans text-[11.5px] font-semibold uppercase tracking-wider ' + accentCls + '">' +
              escapeHtml(statusTagLabel) +
            '</span>' +
            (isDelivered && !isRetur ? '<span class="font-sans text-[11.5px] font-semibold text-lotus-delivered">&bull; Selesai</span>' : '') +
          '</div>' +
          '<a href="' + escapeHtml(fallbackLink) + '" target="_blank" rel="noopener" class="font-sans text-[11.5px] text-lotus-secondary hover:text-lotus-primary underline underline-offset-4">' +
            'spx.co.id &nearr;' +
          '</a>' +
        '</div>' +

        '<h3 class="editorial-heading text-[21px] sm:text-[23px] text-lotus-primary leading-[1.25] mb-2">' +
          escapeHtml(headlineText) +
        '</h3>' +

        (latestTimeStr
          ? '<p class="text-[12.5px] text-lotus-secondary mb-7">Pembaruan terakhir: <span class="font-semibold text-lotus-primary">' + latestTimeStr + '</span></p>'
          : '<div class="mb-6"></div>') +

        '<div>' +
          '<div class="flex items-end justify-between gap-4 mb-2.5">' +
            '<div>' +
              '<span class="block font-sans text-[10px] font-semibold uppercase tracking-wider text-lotus-muted mb-0.5">Asal</span>' +
              '<p class="text-[15px] font-semibold text-lotus-primary leading-tight">' + escapeHtml(originCity) + '</p>' +
            '</div>' +
            '<div class="text-right">' +
              '<span class="block font-sans text-[10px] font-semibold uppercase tracking-wider text-lotus-muted mb-0.5">Tujuan</span>' +
              '<p class="text-[15px] font-semibold text-lotus-primary leading-tight">' + escapeHtml(destinationCity) + '</p>' +
            '</div>' +
          '</div>' +

          '<div class="route-track-bg relative w-full h-[2px] rounded-full my-2.5">' +
            '<div style="width:' + progressPct + '%;" class="' + (isRetur ? 'route-progress-beam-retur' : 'route-progress-beam') + ' h-full rounded-full transition-all duration-700 ease-out"></div>' +
            '<span style="left:' + progressPct + '%;" class="' + (isRetur ? 'route-comet-dot-retur' : 'route-comet-dot') + ' absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full"></span>' +
          '</div>' +

          '<div class="flex items-center justify-between gap-3 text-[11.5px] text-lotus-secondary mt-2">' +
            '<span>' + (isRetur ? 'Paket dikembalikan ke pengirim' : (isDelivered ? 'Pengiriman selesai dengan bukti tanda terima' : 'Perjalanan paket terpantau real-time')) + '</span>' +
            '<span class="font-sans text-[11.5px] font-semibold ' + (isRetur ? 'text-lotus-retur' : (isDelivered ? 'text-lotus-delivered' : 'text-lotus-gold')) + ' shrink-0">' + progressPct + '%</span>' +
          '</div>' +
        '</div>' +

        '<hr class="lotus-divider my-7" />' +

        '<div>' +
          '<div class="flex items-center justify-between mb-5">' +
            '<h4 class="font-sans text-[11px] font-semibold uppercase tracking-[0.08em] text-lotus-secondary">Riwayat Perjalanan</h4>' +
            '<span class="font-sans text-[11.5px] text-lotus-muted">' + riwayat.length + ' pembaruan</span>' +
          '</div>';

      if (riwayat.length === 0) {
        html += '<p class="text-[13px] text-lotus-secondary py-4">Belum ada riwayat perjalanan tercatat.</p>';
      } else {
        html += '<ol class="relative">';
        riwayat.forEach(function (ev, idx) {
          var isFirst = idx === 0;
          var isLast = idx === riwayat.length - 1;
          var dt = new Date(ev.waktu * 1000);
          var waktuStr = dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) +
            ', ' + dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

          html +=
            '<li class="relative flex gap-3.5">' +
              '<div class="relative flex flex-col items-center w-4 shrink-0">' +
                (!isLast ? '<span class="timeline-vertical-line absolute top-4 bottom-0 w-[1px]" aria-hidden="true"></span>' : '') +
                '<div class="relative w-4 h-4 mt-1 flex items-center justify-center">' +
                  (isFirst
                    ? '<span class="timeline-active-node w-2.5 h-2.5 rounded-full"></span>'
                    : '<span class="timeline-past-node w-1.5 h-1.5 rounded-full"></span>') +
                '</div>' +
              '</div>' +

              '<div class="' + (isLast ? 'pb-0' : 'pb-6') + ' flex-1 min-w-0">' +
                '<div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5 mb-0.5">' +
                  '<p class="text-[13.5px] leading-snug ' + (isFirst ? 'font-semibold text-lotus-primary' : 'font-medium text-lotus-primary opacity-85') + '">' +
                    escapeHtml(ev.deskripsi) +
                  '</p>' +
                  '<time class="font-sans text-[11.5px] shrink-0 ' + (isFirst ? 'text-lotus-gold font-semibold' : 'text-lotus-muted') + '">' +
                    waktuStr +
                  '</time>' +
                '</div>' +
                (ev.lokasi
                  ? '<p class="text-[12px] text-lotus-secondary mt-0.5">' + escapeHtml(ev.lokasi) + '</p>'
                  : '') +
              '</div>' +
            '</li>';
        });
        html += '</ol>';
      }

      html += '</div>';
      el.drawerBody.innerHTML = html;
    }

    /* Menutup pop-up: tombol Tutup / backdrop / Esc memanggil history.back(),
       lalu popstate yang benar-benar menyembunyikan drawer (sama seperti tombol Back ponsel). */
    function hideDrawer() {
      drawerOpen = false;
      el.trackDrawerOverlay.classList.remove('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'true');
    }

    function closeTrackDrawer() {
      if (drawerOpen && history.state && history.state.drawer) {
        history.back();
      } else {
        hideDrawer();
      }
    }

    window.addEventListener('popstate', function () {
      if (drawerOpen) hideDrawer();
    });

    el.searchBtn.addEventListener('click', searchResi);
    el.todayOngoingBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = 'ongoing';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      searchResi();
    });
    el.clearBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = '';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      lastData = null;
      renderEmptyState();
    });
    el.clearInputInlineBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.queryInput.focus();
    });
    el.brandResetBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    el.queryInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        searchResi();
      }
    });

    el.closeDrawerBtn.addEventListener('click', closeTrackDrawer);
    el.drawerBackdrop.addEventListener('click', closeTrackDrawer);
    el.drawerCopyBtn.addEventListener('click', function () {
      if (!activeDrawerResi) return;
      copyText(activeDrawerResi);
      el.drawerCopyLabel.textContent = 'Disalin';
      setTimeout(function () { el.drawerCopyLabel.textContent = 'Salin'; }, 1600);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeTrackDrawer();
    });

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
