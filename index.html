<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>larba. — Cek Resi Barranetmedia</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- Early Theme Restoration -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('larba_preview_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    /* ==========================================================================
       TWILIGHT LOTUS DUAL THEME TOKENS (DARK & LIGHT)
       ========================================================================== */
    :root {
      /* Mode Gelap (Twilight Lotus Dark) */
      --bg-base: #0C0918;
      --text-primary: #F7F5FC;
      --text-secondary: #A9A0C4;
      --text-muted: #746A94;

      --accent-primary: #8B96F2;
      --accent-secondary: #B78EF5;
      --accent-gold: #F6C856;
      --accent-gold-ring: rgba(246, 200, 86, 0.34);
      --accent-delivered: #6EE7B7;
      --accent-retur: #FDA4AF;

      --cta-gradient: linear-gradient(135deg, #7884E8, #B78EF5);
      --cta-text: #0C0918;
      --cta-shadow: 0 8px 24px -6px rgba(155, 132, 242, 0.45);
      --cta-shadow-hover: 0 10px 28px -4px rgba(183, 142, 245, 0.6);

      --route-gradient: linear-gradient(90deg, #7884E8 0%, #B78EF5 55%, #F6C856 100%);
      --route-track: rgba(227, 186, 245, 0.14);

      --hairline: rgba(227, 186, 245, 0.12);
      --pill-bg: rgba(255, 255, 255, 0.045);
      --pill-bg-hover: rgba(255, 255, 255, 0.085);
      --pill-border: rgba(227, 186, 245, 0.15);
      --badge-bg: rgba(120, 132, 232, 0.16);

      /* Cardless Alternating Zebra Row Tokens (Dark Mode) */
      --row-odd-bg: transparent;
      --row-even-bg: rgba(183, 142, 245, 0.055);
      --row-hover-bg: rgba(183, 142, 245, 0.10);

      --search-line: rgba(227, 186, 245, 0.18);
      --search-focus: #B78EF5;
      --search-focus-glow: rgba(183, 142, 245, 0.45);

      --timeline-line: linear-gradient(180deg, rgba(246, 200, 86, 0.5) 0%, rgba(183, 142, 245, 0.32) 48%, rgba(120, 132, 232, 0.10) 100%);
      --timeline-dot-past: #8B96F2;

      --overlay-bg: rgba(6, 4, 13, 0.74);
      --sheet-bg: linear-gradient(180deg, rgba(23, 18, 48, 0.97) 0%, rgba(12, 9, 24, 0.99) 100%);
      --sheet-shadow: 0 -20px 60px rgba(6, 4, 13, 0.85);
      --toast-bg: rgba(24, 18, 52, 0.95);
      --toast-shadow: 0 12px 32px rgba(6, 4, 13, 0.72);
    }

    html.light {
      /* Mode Terang (Morning Lotus Light) */
      --bg-base: #FAF8FD;
      --text-primary: #141026;
      --text-secondary: #595175;
      --text-muted: #8B81A8;

      --accent-primary: #5663D1;
      --accent-secondary: #8C63DF;
      --accent-gold: #D98A1C;
      --accent-gold-ring: rgba(217, 138, 28, 0.28);
      --accent-delivered: #0D9488;
      --accent-retur: #E11D48;

      --cta-gradient: linear-gradient(135deg, #5663D1, #8C63DF);
      --cta-text: #FFFFFF;
      --cta-shadow: 0 8px 22px -6px rgba(86, 99, 209, 0.36);
      --cta-shadow-hover: 0 10px 26px -4px rgba(140, 99, 223, 0.48);

      --route-gradient: linear-gradient(90deg, #5663D1 0%, #936CE8 55%, #D98A1C 100%);
      --route-track: rgba(20, 16, 38, 0.09);

      --hairline: rgba(20, 16, 38, 0.09);
      --pill-bg: rgba(20, 16, 38, 0.035);
      --pill-bg-hover: rgba(20, 16, 38, 0.075);
      --pill-border: rgba(20, 16, 38, 0.10);
      --badge-bg: rgba(86, 99, 209, 0.11);

      /* Cardless Alternating Zebra Row Tokens (Light Mode) */
      --row-odd-bg: transparent;
      --row-even-bg: rgba(86, 99, 209, 0.045);
      --row-hover-bg: rgba(140, 99, 223, 0.085);

      --search-line: rgba(20, 16, 38, 0.14);
      --search-focus: #5663D1;
      --search-focus-glow: rgba(86, 99, 209, 0.24);

      --timeline-line: linear-gradient(180deg, rgba(217, 138, 28, 0.45) 0%, rgba(140, 99, 223, 0.28) 50%, rgba(86, 99, 209, 0.10) 100%);
      --timeline-dot-past: #8C63DF;

      --overlay-bg: rgba(20, 16, 38, 0.34);
      --sheet-bg: linear-gradient(180deg, rgba(252, 250, 255, 0.97) 0%, rgba(243, 238, 249, 0.99) 100%);
      --sheet-shadow: 0 -18px 50px rgba(20, 16, 38, 0.14);
      --toast-bg: rgba(255, 255, 255, 0.96);
      --toast-shadow: 0 12px 30px rgba(20, 16, 38, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .theme-transition {
      transition:
        background-color 0.35s ease,
        color 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        opacity 0.35s ease;
    }

    /* Dual Full-Viewport Atmospheric Canvases (0.35s Cross-Fade) */
    .atmosphere-dark {
      background-color: #0C0918;
      background-image:
        radial-gradient(ellipse 64% 42% at 20% 10%, rgba(111, 124, 230, 0.22) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 56% 36% at 55% -4%, rgba(155, 132, 242, 0.16) 0%, rgba(155, 132, 242, 0) 74%),
        radial-gradient(ellipse 48% 32% at 82% 8%, rgba(223, 183, 242, 0.11) 0%, rgba(223, 183, 242, 0) 72%),
        radial-gradient(circle at 68% 12%, rgba(246, 200, 86, 0.08) 0%, rgba(246, 200, 86, 0) 44%),
        linear-gradient(180deg, #15102B 0%, #0F0B21 40%, #0C0918 100%);
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-dark {
      opacity: 0;
    }

    .atmosphere-light {
      background-color: #FAF8FD;
      background-image:
        radial-gradient(ellipse 64% 44% at 20% 8%, rgba(111, 124, 230, 0.11) 0%, rgba(111, 124, 230, 0) 76%),
        radial-gradient(ellipse 54% 38% at 78% 6%, rgba(196, 152, 235, 0.15) 0%, rgba(196, 152, 235, 0) 74%),
        radial-gradient(circle at 64% 12%, rgba(235, 174, 52, 0.09) 0%, rgba(235, 174, 52, 0) 46%),
        linear-gradient(180deg, #F3EEF9 0%, #F7F4FC 42%, #FAF8FD 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    html.light .atmosphere-light {
      opacity: 1;
    }

    .editorial-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .text-lotus-primary { color: var(--text-primary); }
    .text-lotus-secondary { color: var(--text-secondary); }
    .text-lotus-muted { color: var(--text-muted); }
    .text-lotus-accent { color: var(--accent-primary); }
    .text-lotus-gold { color: var(--accent-gold); }
    .text-lotus-delivered { color: var(--accent-delivered); }
    .text-lotus-retur { color: var(--accent-retur); }

    .lotus-pill {
      background-color: var(--pill-bg);
      border: 1px solid var(--pill-border);
      transition: background-color 0.25s ease, border-color 0.35s ease, color 0.35s ease;
    }

    .lotus-pill:hover {
      background-color: var(--pill-bg-hover);
    }

    .lotus-divider {
      border: 0;
      border-top: 1px solid var(--hairline);
      transition: border-color 0.35s ease;
    }

    .lotus-cta-btn {
      background: var(--cta-gradient);
      color: var(--cta-text);
      box-shadow: var(--cta-shadow);
      transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.25s ease, color 0.35s ease;
    }

    .lotus-cta-btn:hover {
      filter: brightness(1.06);
      box-shadow: var(--cta-shadow-hover);
    }

    .lotus-cta-btn:active {
      transform: scale(0.97);
    }

    /* Borderless Underline Input & Filter Controls */
    .search-underline {
      border-bottom: 1px solid var(--search-line);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-underline:focus-within {
      border-bottom-color: var(--search-focus);
      box-shadow: 0 10px 26px -14px var(--search-focus-glow);
    }

    /* Cardless Alternating Zebra-Striped Rows (Zero Boxes / Borders) */
    .resi-row {
      border-bottom: 1px solid var(--hairline);
      transition: background-color 0.25s ease;
    }

    .resi-row-odd {
      background-color: var(--row-odd-bg);
    }

    .resi-row-even {
      background-color: var(--row-even-bg);
    }

    .resi-row:hover {
      background-color: var(--row-hover-bg);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.85;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }
    html.light input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
    }
    select option {
      background-color: #171230;
      color: #F7F5FC;
    }
    html.light select option {
      background-color: #FAF8FD;
      color: #141026;
    }

    /* Radar Dot & Active Node Pulse Animation */
    @keyframes goldRadarPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 0 6px rgba(246, 200, 86, 0);
      }
    }

    .radar-pulse-dot {
      background-color: var(--accent-gold);
      animation: goldRadarPulse 2.6s ease-in-out infinite;
      transition: background-color 0.35s ease;
    }

    /* Route Progress Track & Glowing Comet Dot */
    .route-track-bg {
      background-color: var(--route-track);
      transition: background-color 0.35s ease;
    }

    .route-progress-beam {
      background: var(--route-gradient);
    }

    .route-comet-dot {
      background-color: var(--accent-gold);
      box-shadow: 0 0 10px 2px var(--accent-gold-ring), 0 0 4px 1px var(--accent-gold);
      transition: left 0.7s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease, box-shadow 0.35s ease;
    }

    /* Vertical Timeline Line & Pulsing Halo Ring */
    .timeline-vertical-line {
      background: var(--timeline-line);
    }

    @keyframes checkpointHalo {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 4px var(--accent-gold-ring), 0 0 12px var(--accent-gold-ring);
      }
      50% {
        transform: scale(1.14);
        box-shadow: 0 0 0 8px rgba(246, 200, 86, 0), 0 0 16px var(--accent-gold-ring);
      }
    }

    .timeline-active-node {
      background-color: var(--accent-gold);
      animation: checkpointHalo 2.5s ease-in-out infinite;
      transition: background-color 0.35s ease;
    }

    .timeline-past-node {
      background-color: var(--timeline-dot-past);
      transition: background-color 0.35s ease;
    }

    /* Slide-Up / Centered Frosted Bottom Sheet */
    .drawer-overlay {
      background-color: var(--overlay-bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, background-color 0.35s ease;
    }

    .drawer-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-sheet {
      background: var(--sheet-bg);
      border: 1px solid var(--pill-border);
      box-shadow: var(--sheet-shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transform: translateY(24px) scale(0.98);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease;
    }

    .drawer-overlay.is-open .drawer-sheet {
      transform: translateY(0) scale(1);
    }

    /* Floating Toast */
    .lotus-toast {
      background-color: var(--toast-bg);
      border: 1px solid var(--pill-border);
      box-shadow: var(--toast-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="relative min-h-[100dvh] selection:bg-[#8B96F2]/25">

  <!-- Full-Viewport Dual Atmospheric Background Layers -->
  <div class="atmosphere-dark fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>
  <div class="atmosphere-light fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>

  <!-- Responsive Editorial Container (Cardless Two-Column on Desktop, Single-Column on Mobile) -->
  <div class="relative z-10 w-full max-w-[1040px] mx-auto px-5 sm:px-8 pt-7 sm:pt-9 pb-24">

    <!-- 1. Minimal Top Header -->
    <header class="flex items-center justify-between gap-3 pb-7 mb-8 sm:mb-10 border-b border-[var(--hairline)]">
      <!-- Clean Wordmark ('larba.') with Purple Dot '.' -->
      <button
        id="brandResetBtn"
        type="button"
        class="inline-flex items-baseline focus:outline-none cursor-pointer group"
        aria-label="larba."
      >
        <span class="editorial-heading text-[26px] sm:text-[28px] text-lotus-primary theme-transition leading-none">larba</span>
        <span style="color: var(--accent-secondary);" class="editorial-heading text-[28px] sm:text-[30px] theme-transition leading-none">.</span>
      </button>

      <!-- Right Header Controls: Theme Switcher & Barranetmedia Pill -->
      <div class="flex items-center gap-2 sm:gap-2.5">
        <button
          id="themeToggleBtn"
          type="button"
          aria-label="Ganti tema tampilan"
          class="lotus-pill inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] sm:text-[12.5px] font-medium text-lotus-primary cursor-pointer"
        >
          <svg id="iconSun" class="w-3.5 h-3.5 text-lotus-gold shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg id="iconMoon" class="hidden w-3.5 h-3.5 text-lotus-accent shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <span id="themeToggleLabel" class="whitespace-nowrap">Mode Terang</span>
        </button>

        <div class="lotus-pill inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-[12px] sm:text-[12.5px] font-medium text-lotus-secondary">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6EE7B7] shrink-0"></span>
          <span>Barranetmedia</span>
        </div>
      </div>
    </header>

    <!-- Desktop 2-Column Editorial Layout (Left: Hero + Borderless Search/Filters | Right: Zebra-Striped List) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-start">

      <!-- LEFT COLUMN (5 Cols on Desktop, Sticky) -->
      <aside class="lg:col-span-5 lg:sticky lg:top-8">
        <!-- Hero Text -->
        <div class="mb-8">
          <div class="lotus-pill inline-flex items-center gap-2 px-3.5 py-1 rounded-full backdrop-blur-md mb-4">
            <span class="w-1.5 h-1.5 rounded-full radar-pulse-dot shrink-0"></span>
            <span class="font-sans text-[11.5px] font-semibold tracking-[0.04em] uppercase text-lotus-primary theme-transition">
              Rahasia Perusahaan
            </span>
          </div>

          <h1 class="editorial-heading text-[29px] sm:text-[34px] text-lotus-primary theme-transition mb-2">
            Cek Resi Barranetmedia
          </h1>

          <p class="text-[14.5px] leading-relaxed text-lotus-secondary theme-transition">
            Selamat berjuang, sukses....
          </p>
        </div>

        <!-- Strictly Borderless Underline Search & Filters (Zero Boxes) -->
        <div aria-label="Pencarian dan Filter Resi" class="space-y-5">
          <!-- Multi-Query Underline Input -->
          <div>
            <label for="queryInput" class="block font-sans text-[12px] font-semibold text-lotus-secondary mb-1.5">
              Cari resi, nama, atau no HP
            </label>
            <div class="search-underline flex items-start gap-2 pb-2">
              <textarea
                id="queryInput"
                rows="2"
                spellcheck="false"
                placeholder="SPXID069316549624, Budi, 0812..."
                class="w-full min-w-0 bg-transparent font-sans text-[14.5px] leading-relaxed text-lotus-primary theme-transition focus:outline-none resize-y"
              ></textarea>
              <button
                id="clearInputInlineBtn"
                type="button"
                aria-label="Hapus kata kunci"
                class="text-lotus-secondary hover:text-lotus-primary text-lg leading-none px-1.5 py-0.5 transition-colors cursor-pointer shrink-0"
              >
                &times;
              </button>
            </div>
            <p class="text-[11.5px] text-lotus-muted mt-1.5">
              Pisahkan dengan koma atau baris baru untuk cari banyak sekaligus.
            </p>
          </div>

          <!-- 4 Borderless Underline Filter Fields -->
          <div class="grid grid-cols-2 gap-x-5 gap-y-4 pt-1">
            <div class="search-underline pb-1.5">
              <label for="csInput" class="block font-sans text-[11px] font-semibold text-lotus-muted mb-1">CS</label>
              <input
                type="text"
                id="csInput"
                placeholder="Nama CS"
                class="w-full bg-transparent text-[13.5px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>

            <div class="search-underline pb-1.5">
              <label for="statusInput" class="block font-sans text-[11px] font-semibold text-lotus-muted mb-1">Status</label>
              <select
                id="statusInput"
                class="w-full bg-transparent text-[13.5px] font-medium text-lotus-primary focus:outline-none cursor-pointer"
              >
                <option value="">Semua status</option>
                <option value="ongoing">On going</option>
                <option value="delivered">Delivered</option>
                <option value="retur">Retur</option>
              </select>
            </div>

            <div class="search-underline pb-1.5">
              <label for="dateFromInput" class="block font-sans text-[11px] font-semibold text-lotus-muted mb-1">Dari tanggal</label>
              <input
                type="date"
                id="dateFromInput"
                class="w-full bg-transparent text-[13px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>

            <div class="search-underline pb-1.5">
              <label for="dateToInput" class="block font-sans text-[11px] font-semibold text-lotus-muted mb-1">Sampai tanggal</label>
              <input
                type="date"
                id="dateToInput"
                class="w-full bg-transparent text-[13px] font-medium text-lotus-primary focus:outline-none"
              />
            </div>
          </div>

          <!-- Action Buttons Row -->
          <div class="flex flex-wrap items-center gap-2.5 pt-2">
            <button
              id="searchBtn"
              type="button"
              class="lotus-cta-btn font-bold text-[13px] tracking-[-0.01em] px-5 py-2.5 rounded-full cursor-pointer"
            >
              Cari Resi
            </button>

            <button
              id="todayOngoingBtn"
              type="button"
              class="lotus-pill text-[12.5px] font-medium text-lotus-primary px-4 py-2.5 rounded-full cursor-pointer"
            >
              Semua ongoing
            </button>

            <button
              id="clearBtn"
              type="button"
              class="text-[12.5px] font-medium text-lotus-secondary hover:text-lotus-primary px-2.5 py-2 transition-colors cursor-pointer"
            >
              Bersihkan
            </button>
          </div>
        </div>
      </aside>

      <!-- RIGHT COLUMN (7 Cols on Desktop): Cardless Zebra-Striped Results Stream -->
      <main aria-label="Daftar Resi Pengiriman" class="lg:col-span-7 lg:border-l lg:border-[var(--hairline)] lg:pl-10">
        <div class="flex items-center justify-between gap-2 pb-3.5 border-b border-[var(--hairline)]">
          <h2 class="font-sans text-[12px] font-semibold uppercase tracking-[0.08em] text-lotus-secondary">
            Daftar Resi
          </h2>
          <span id="statusLine" class="font-sans text-[12px] font-medium text-lotus-muted">
            Menampilkan 4 data contoh
          </span>
        </div>

        <!-- Cardless Alternating Zebra List Container -->
        <div id="resultsArea" class="divide-y divide-[var(--hairline)]"></div>
      </main>

    </div>

  </div>

  <!-- ========================================================================
       SLIDE-UP / CENTERED FROSTED SHEET ('In-App Live SPX Tracking')
       ======================================================================== -->
  <div
    id="trackDrawerOverlay"
    aria-hidden="true"
    class="drawer-overlay fixed inset-0 z-50 backdrop-blur-sm flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4"
  >
    <!-- Clickable Backdrop -->
    <div id="drawerBackdrop" class="fixed inset-0"></div>

    <!-- Frosted Sheet Panel -->
    <div
      role="dialog"

    /* ========================================================================
       1. DUAL THEME SWITCHER (Twilight Lotus Dark <-> Morning Lotus Light)
       ======================================================================== */
    function syncThemeUI() {
      var isLight = document.documentElement.classList.contains('light');
      if (isLight) {
        el.iconSun.classList.add('hidden');
        el.iconMoon.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Gelap';
      } else {
        el.iconMoon.classList.add('hidden');
        el.iconSun.classList.remove('hidden');
        el.themeToggleLabel.textContent = 'Mode Terang';
      }
    }

    function toggleTheme() {
      var root = document.documentElement;
      var switchingToLight = !root.classList.contains('light');
      if (switchingToLight) {
        root.classList.remove('dark');
        root.classList.add('light');
      } else {
        root.classList.remove('light');
        root.classList.add('dark');
      }
      try {
        localStorage.setItem('larba_preview_theme', switchingToLight ? 'light' : 'dark');
      } catch (e) {}
      syncThemeUI();
      showToast(switchingToLight ? 'Beralih ke Mode Terang' : 'Beralih ke Mode Gelap');
    }

    el.themeToggleBtn.addEventListener('click', toggleTheme);
    syncThemeUI();

    function showToast(message) {
      el.toastText.textContent = message;
      el.toastBanner.classList.remove('opacity-0', 'translate-y-2');
      el.toastBanner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.toastBanner.classList.remove('opacity-100', 'translate-y-0');
        el.toastBanner.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function copyTextToClipboard(text, customToast) {
      var temp = document.createElement('textarea');
      temp.value = text;
      temp.setAttribute('readonly', '');
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        showToast(customToast || 'Nomor resi disalin');
      } catch (e) {
        showToast('Gagal menyalin teks');
      }
      document.body.removeChild(temp);
    }

      if (group === 'delivered') {
        return {
          dot: 'var(--accent-delivered)',
          textClass: 'text-lotus-delivered',
          pillBg: 'rgba(110, 231, 183, 0.14)',
          pillBorder: 'rgba(110, 231, 183, 0.3)'

      if (group === 'ongoing') {
        return {
          dot: 'var(--accent-gold)',
          textClass: 'text-lotus-gold',
          pillBg: 'rgba(246, 200, 86, 0.14)',
          pillBorder: 'rgba(246, 200, 86, 0.3)'

      if (group === 'retur') {
        return {
          dot: 'var(--accent-retur)',
          textClass: 'text-lotus-retur',
          pillBg: 'rgba(253, 164, 175, 0.14)',
          pillBorder: 'rgba(253, 164, 175, 0.3)'
        };
      }
      return {
        dot: 'var(--accent-primary)',
        textClass: 'text-lotus-accent',
        pillBg: 'var(--badge-bg)',
        pillBorder: 'var(--pill-border)'
      };
    }

    function filterOrders() {
      var rawQ = el.queryInput.value.trim().toLowerCase();
      var terms = rawQ ? rawQ.split(/[\n,]+/).map(function (t) { return t.trim(); }).filter(Boolean) : [];
      var cs = el.csInput.value.trim().toLowerCase();
      var st = el.statusInput.value;
      var dFrom = el.dateFromInput.value;
      var dTo = el.dateToInput.value;

      currentFiltered = SAMPLE_ORDERS.filter(function (item) {
        var matchQ = terms.length === 0 || terms.some(function (term) {
          return item.resi.toLowerCase().indexOf(term) !== -1 ||
            item.nama.toLowerCase().indexOf(term) !== -1 ||
            item.noHp.toLowerCase().indexOf(term) !== -1;
        });
        var matchCs = !cs || item.cs.toLowerCase().indexOf(cs) !== -1;
        var matchSt = !st || item.statusGroup === st;
        var matchFrom = !dFrom || item.dateIso >= dFrom;
        var matchTo = !dTo || item.dateIso <= dTo;
        return matchQ && matchCs && matchSt && matchFrom && matchTo;
      });

      el.statusLine.textContent = 'Menampilkan ' + currentFiltered.length + ' hasil';
      renderRows(currentFiltered);
    }

    function toggleRowDetail(resi) {
      expandedRows[resi] = !expandedRows[resi];

          '<div class="route-track-bg relative w-full h-[2px] rounded-full my-2.5">' +
            '<div style="width: ' + data.progressPct + '%;" class="route-progress-beam h-full rounded-full"></div>' +
            '<span style="left: ' + data.progressPct + '%;" class="route-comet-dot absolute top-1/2 -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 rounded-full"></span>' +
          '</div>' +

          '<div class="flex items-center justify-between gap-3 text-[11.5px] text-lotus-secondary mt-2">' +
            '<span>' + (isDelivered ? 'Pengiriman selesai dengan bukti tanda terima' : 'Perjalanan paket terpantau langsung') + '</span>' +
            '<span class="font-mono text-[11.5px] font-semibold ' + (isDelivered ? 'text-lotus-delivered' : 'text-lotus-gold') + '">' + data.progressPct + '%</span>' +
          '</div>' +
        '</div>' +

        '<hr class="lotus-divider my-7" />' +

        '<div>' +
          '<div class="flex items-center justify-between mb-5">' +
            '<h4 class="text-[11px] font-bold uppercase tracking-[0.12em] text-lotus-secondary">Riwayat Perjalanan</h4>' +
            '<span class="font-mono text-[11px] text-lotus-muted">' + riwayat.length + ' pembaruan</span>' +
          '</div>' +
          '<ol class="relative">';

      riwayat.forEach(function (ev, idx) {
        var isFirst = idx === 0;
        var isLast = idx === riwayat.length - 1;
        var dt = new Date(ev.waktu * 1000);
        var waktuStr = dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) +
          ', ' + dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        html +=
          '<li class="relative flex gap-3.5">' +
            '<div class="relative flex flex-col items-center w-4 shrink-0">' +
              (!isLast ? '<span class="timeline-vertical-line absolute top-4 bottom-0 w-[1px]" aria-hidden="true"></span>' : '') +
              '<div class="relative w-4 h-4 mt-1 flex items-center justify-center">' +
                (isFirst
                  ? '<span class="timeline-active-node w-2.5 h-2.5 rounded-full"></span>'
                  : '<span class="timeline-past-node w-1.5 h-1.5 rounded-full"></span>') +
              '</div>' +
            '</div>' +

            '<div class="' + (isLast ? 'pb-0' : 'pb-5') + ' flex-1 min-w-0">' +
              '<div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-0.5 mb-0.5">' +
                '<p class="text-[13.5px] leading-snug ' + (isFirst ? 'font-semibold text-lotus-primary' : 'font-medium text-lotus-primary opacity-85') + '">' +
                  escapeHtml(ev.deskripsi) +
                '</p>' +
                '<time class="font-mono text-[11px] shrink-0 ' + (isFirst ? 'text-lotus-gold font-medium' : 'text-lotus-muted') + '">' +
                  waktuStr +
                '</time>' +
              '</div>' +
              (ev.lokasi
                ? '<p class="text-[12px] text-lotus-secondary mt-0.5">' + escapeHtml(ev.lokasi) + '</p>'
                : '') +
            '</div>' +
          '</li>';
      });

      html += '</ol></div>';
      el.drawerBody.innerHTML = html;

      el.trackDrawerOverlay.classList.add('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'false');
    }

    function closeTrackDrawer() {
      el.trackDrawerOverlay.classList.remove('is-open');
      el.trackDrawerOverlay.setAttribute('aria-hidden', 'true');
    }

    // Event Listeners
    el.searchBtn.addEventListener('click', filterOrders);
    el.queryInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) filterOrders();
    });
    el.statusInput.addEventListener('change', filterOrders);
    el.dateFromInput.addEventListener('change', filterOrders);
    el.dateToInput.addEventListener('change', filterOrders);

    el.todayOngoingBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = 'ongoing';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      filterOrders();
    });

    el.clearBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      el.csInput.value = '';
      el.statusInput.value = '';
      el.dateFromInput.value = '';
      el.dateToInput.value = '';
      filterOrders();
    });

    el.clearInputInlineBtn.addEventListener('click', function () {
      el.queryInput.value = '';
      filterOrders();
      el.queryInput.focus();
    });

    el.brandResetBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    el.closeDrawerBtn.addEventListener('click', closeTrackDrawer);
    el.drawerBackdrop.addEventListener('click', closeTrackDrawer);
    el.drawerCopyBtn.addEventListener('click', function () {
      if (!activeDrawerResi) return;
      copyTextToClipboard(activeDrawerResi, 'Nomor resi disalin');
      el.drawerCopyLabel.textContent = 'Disalin';
      setTimeout(function () {
        el.drawerCopyLabel.textContent = 'Salin';
      }, 1600);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeTrackDrawer();
    });

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    // Initialize Preview
    renderRows(SAMPLE_ORDERS);
  </script>
</body>
</html>
